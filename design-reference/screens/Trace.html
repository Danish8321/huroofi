<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Trace the letter</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', 'Noto Sans Arabic', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 26px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Lesson.dc.html" aria-label="Back to lesson" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #13294B; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; gap: 6px; background: #FFFFFF; border-radius: 999px; padding: 5px">
      <span style="flex-grow: 1; height: 38px; border-radius: 999px; background: #D6F2C8; color: #13294B; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 16px; font-weight: 800">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#158048" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Meet</span>
      <span style="flex-grow: 1; height: 38px; border-radius: 999px; background: #1F6FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">2 Trace</span>
      <span style="flex-grow: 1; height: 38px; border-radius: 999px; color: #4A5D7A; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">3 Play</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; margin-top: 18px">
    <img src="../../assets/illustrations/png/duck.png" alt="Duck helper" style="width: 64px; height: 64px; object-fit: contain; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; background: #FFFFFF; border-radius: 20px; padding: 10px 14px; font-size: 18px; font-weight: 700; line-height: 1.25">
      Start at the green dot <span style="color: #158048; font-weight: 800">1</span>, follow the arrow, then add the dot <span style="color: #1F6FE0; font-weight: 800">2</span>!
    </div>
  </div>

  <div style="margin-top: 16px; background: #FFFFFF; border-radius: 34px; padding: 18px 10px; box-shadow: 0 8px 0 #CFE2F7; display: flex; justify-content: center">
    <svg width="330" height="270" viewBox="0 0 320 262" role="img" aria-label="Tracing guide for the letter baa">
      <line x1="16" y1="60" x2="304" y2="60" stroke="#E3ECF7" stroke-width="2" stroke-dasharray="6 8"></line>
      <line x1="16" y1="172" x2="304" y2="172" stroke="#C9DAEE" stroke-width="3"></line>
      <path d="M262 62 C272 120 252 172 200 172 L110 172 C66 172 50 148 54 112" fill="none" stroke="#EEF3F9" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M262 62 C272 120 252 172 200 172 L110 172 C66 172 50 148 54 112" fill="none" stroke="#9CB4D3" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"></path>
      <path d="M262 62 C272 120 252 172 200 172 L110 172 C66 172 50 148 54 112" pathLength="100" fill="none" stroke="{{ink}}" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="{{dash}}"></path>
      <path d="M294 74 Q304 112 288 142" fill="none" stroke="#1F6FE0" stroke-width="4" stroke-linecap="round"></path>
      <path d="M278 134 L288 144 L296 130" fill="none" stroke="#1F6FE0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="262" cy="62" r="18" fill="#158048"></circle>
      <text x="262" y="69" text-anchor="middle" font-family="Baloo Bhaijaan 2, system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">1</text>
      <circle cx="158" cy="222" r="17" fill="#EEF3F9" stroke="#1F6FE0" stroke-width="3" stroke-dasharray="4 5"></circle>
      <text x="158" y="229" text-anchor="middle" font-family="Baloo Bhaijaan 2, system-ui, sans-serif" font-size="18" font-weight="800" fill="#1F6FE0">2</text>
    </svg>
  </div>

  <div style="margin-top: 18px; display: flex; align-items: center; justify-content: space-between">
    <sc-for list="{{crayons}}" as="c" hint-placeholder-count="5">
      <button type="button" aria-label="{{c.label}}" onClick="{{c.pick}}" style="width: 52px; height: 52px; border-radius: 50%; background: {{c.hex}}; border: {{c.ring}}; box-shadow: 0 4px 0 rgba(19, 41, 75, 0.18); cursor: pointer; padding: 0"></button>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; gap: 12px">
    <button type="button" onClick="{{clear}}" style="width: 120px; height: 64px; border-radius: 22px; border: 3px solid #A9CBF2; background: #FFFFFF; color: #13294B; font-family: inherit; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v5h5"></path></svg>
      Again
    </button>
    <a href="Quiz.dc.html" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 22px; background: #1F6FE0; box-shadow: 0 6px 0 #1555B0; color: #FFFFFF; text-decoration: none; font-size: 22px; font-weight: 800">
      I did it!
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const picked = st.color || 'coral';
    const list = [
      { id: 'coral', hex: '#FF7A59', label: 'Orange crayon' },
      { id: 'blue', hex: '#3B8CF0', label: 'Blue crayon' },
      { id: 'green', hex: '#3BAA5C', label: 'Green crayon' },
      { id: 'purple', hex: '#8A6CE8', label: 'Purple crayon' },
      { id: 'pink', hex: '#FF6FA5', label: 'Pink crayon' }
    ];
    const crayons = list.map((c) => ({
      ...c,
      ring: c.id === picked ? '5px solid #13294B' : '5px solid #FFFFFF',
      pick: () => this.setState({ color: c.id, cleared: false })
    }));
    const ink = list.find((c) => c.id === picked).hex;
    return {
      crayons,
      ink,
      dash: st.cleared ? '0 100' : '62 100',
      clear: () => this.setState({ cleared: true })
    };
  }
}
</script>
</body>
</html>
