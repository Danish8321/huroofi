<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Paint the letter</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
@keyframes pop{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', 'Noto Sans Arabic', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 30px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="ToddlerHome.dc.html" aria-label="Home" style="width: 68px; height: 68px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 5px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #13294B">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
    </a>
    <div style="height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #FFFFFF; border-radius: 30px" aria-label="Colour the letter baa">
      <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 34px; font-weight: 700; line-height: 1.4; color: #13294B">لوّن الباء</span>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#EC4F8C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
    </div>
    <a href="ParentGate.dc.html" aria-label="Grown-ups: press and hold to open settings" style="width: 44px; height: 44px; border-radius: 50%; background: #D5E2F0; display: flex; align-items: center; justify-content: center; color: #4A5D7A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    </a>
  </div>

  <div style="position: relative; margin-top: 16px; background: #FFFFFF; border-radius: 40px; border: 6px solid #EC4F8C; box-shadow: 0 8px 0 #B83A6B; overflow: hidden">
    <svg viewBox="0 0 320 380" width="338" height="401" role="img" aria-label="Paint over the letter baa with your finger" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" style="display: block; touch-action: none; cursor: crosshair">
      <text x="160" y="250" text-anchor="middle" font-family="Noto Naskh Arabic, serif" font-weight="700" font-size="300" fill="#FFF0F5" stroke="#F5A9C6" stroke-width="4" stroke-dasharray="10 10">ب</text>
      <path d="{{pCoral}}" fill="none" stroke="#FF7A59" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></path>
      <path d="{{pBlue}}" fill="none" stroke="#3B8CF0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></path>
      <path d="{{pGreen}}" fill="none" stroke="#3BAA5C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></path>
      <path d="{{pPurple}}" fill="none" stroke="#8A6CE8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></path>
    </svg>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <svg width="86" height="86" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; top: 14px; right: 14px; animation: pop 0.45s ease-out both; pointer-events: none"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="#FFC93C" stroke="#26324A" stroke-width="1.1" stroke-linejoin="round"></path></svg>
    </sc-if>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
    <sc-for list="{{crayons}}" as="c" hint-placeholder-count="4">
      <button type="button" aria-label="{{c.label}}" onClick="{{c.pick}}" style="width: 64px; height: 64px; border-radius: 50%; background: {{c.hex}}; border: {{c.ring}}; box-sizing: border-box; box-shadow: 0 5px 0 rgba(19, 41, 75, 0.2); cursor: pointer; padding: 0"></button>
    </sc-for>
    <button type="button" aria-label="Wipe clean" onClick="{{clear}}" style="width: 64px; height: 64px; border-radius: 50%; border: 3px solid #A9CBF2; background: #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #13294B; cursor: pointer; padding: 0">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21h10"></path><path d="M5 16l9-9 5 5-6 6H8z"></path><path d="M10 11l5 5"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  point(e) {
    const el = e.currentTarget;
    if (!el || !el.getBoundingClientRect) return null;
    const r = el.getBoundingClientRect();
    return {
      x: Math.round(((e.clientX - r.left) / r.width) * 320),
      y: Math.round(((e.clientY - r.top) / r.height) * 380)
    };
  }
  renderVals() {
    const st = this.state || {};
    const color = st.color || 'coral';
    const paths = st.paths || { coral: '', blue: '', green: '', purple: '' };
    const count = st.count || 0;
    const add = (seg, extra) => {
      this.setState((s) => {
        const ps = (s && s.paths) || { coral: '', blue: '', green: '', purple: '' };
        const c = (s && s.color) || 'coral';
        return { paths: { ...ps, [c]: (ps[c] || '') + seg }, count: ((s && s.count) || 0) + extra };
      });
    };
    const list = [
      { id: 'coral', hex: '#FF7A59', label: 'Orange paint' },
      { id: 'blue', hex: '#3B8CF0', label: 'Blue paint' },
      { id: 'green', hex: '#3BAA5C', label: 'Green paint' },
      { id: 'purple', hex: '#8A6CE8', label: 'Purple paint' }
    ];
    return {
      pCoral: paths.coral || 'M0 0',
      pBlue: paths.blue || 'M0 0',
      pGreen: paths.green || 'M0 0',
      pPurple: paths.purple || 'M0 0',
      done: count > 60,
      crayons: list.map((c) => ({
        ...c,
        ring: c.id === color ? '6px solid #13294B' : '6px solid #FFFFFF',
        pick: () => this.setState({ color: c.id })
      })),
      down: (e) => {
        const p = this.point(e);
        if (!p) return;
        this.drawing = true;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        add(' M' + p.x + ' ' + p.y + ' L' + (p.x + 0.5) + ' ' + p.y, 1);
      },
      move: (e) => {
        if (!this.drawing) return;
        const p = this.point(e);
        if (!p) return;
        add(' L' + p.x + ' ' + p.y, 1);
      },
      up: () => { this.drawing = false; },
      clear: () => this.setState({ paths: { coral: '', blue: '', green: '', purple: '' }, count: 0 })
    };
  }
}
</script>
</body>
</html>
