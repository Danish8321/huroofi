<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Where's the duck?</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
@keyframes wigA{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-9deg) scale(1.1)}75%{transform:rotate(9deg) scale(1.1)}}
@keyframes wigB{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-9deg) scale(1.1)}75%{transform:rotate(9deg) scale(1.1)}}
@keyframes nudgeA{0%,100%{transform:translateX(0)}30%{transform:translateX(-8px)}70%{transform:translateX(8px)}}
@keyframes nudgeB{0%,100%{transform:translateX(0)}30%{transform:translateX(-8px)}70%{transform:translateX(8px)}}
@keyframes yay{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1.08)}}
@keyframes pop{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes talk{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', 'Noto Sans Arabic', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 30px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="ToddlerHome.dc.html" aria-label="Home" style="width: 68px; height: 68px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 5px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #13294B">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
    </a>
    <div style="display: flex; gap: 10px" aria-hidden="true">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
        <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="{{d.fill}}" stroke="#26324A" stroke-width="1.4" stroke-linejoin="round"></path></svg>
      </sc-for>
    </div>
    <a href="ParentGate.dc.html" aria-label="Grown-ups: press and hold to open settings" style="width: 44px; height: 44px; border-radius: 50%; background: #D5E2F0; display: flex; align-items: center; justify-content: center; color: #4A5D7A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    </a>
  </div>

  <div style="margin-top: 12px; display: flex; align-items: center; gap: 12px">
    <button type="button" onClick="{{say}}" aria-label="{{r.en}}" style="width: 84px; height: 84px; flex-shrink: 0; border-radius: 50%; border: none; background: #FFC93C; box-shadow: 0 6px 0 #E0A400; display: flex; align-items: center; justify-content: center; color: #13294B; cursor: pointer">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
    </button>
    <div style="flex-grow: 1; background: #FFFFFF; border-radius: 26px 26px 26px 8px; padding: 4px 16px 8px; display: flex; flex-direction: column; align-items: flex-end">
      <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 42px; font-weight: 700; line-height: 1.45; color: #13294B">{{r.ar}}</span>
      <span style="font-size: 18px; font-weight: 700; color: #4A5D7A; line-height: 1.2">{{r.en}}</span>
    </div>
  </div>

  <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="2">
      <button type="button" onClick="{{t.pick}}" aria-label="{{t.label}}" style="position: relative; height: 230px; border-radius: 40px; background: {{t.bg}}; border: 6px solid {{t.border}}; box-sizing: border-box; box-shadow: 0 8px 0 {{t.shadow}}; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 0; font-family: inherit; color: #13294B">
        <img src="{{t.img}}" alt="" style="width: 140px; height: 140px; object-fit: contain; animation: {{t.anim}}">
        <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 50px; font-weight: 700; line-height: 1.3"><span style="color: #A35400">{{t.first}}</span>{{t.rest}}</span>
        <sc-if value="{{t.party}}" hint-placeholder-val="{{false}}">
          <svg width="64" height="64" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; top: 14px; left: 18px; animation: pop 0.4s ease-out both"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="#FFC93C" stroke="#26324A" stroke-width="1.2" stroke-linejoin="round"></path></svg>
          <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; top: 28px; right: 22px; animation: pop 0.4s ease-out 0.15s both"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="#FF6FA5" stroke="#26324A" stroke-width="1.4" stroke-linejoin="round"></path></svg>
          <svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; bottom: 18px; right: 34px; animation: pop 0.4s ease-out 0.3s both"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="#3B8CF0" stroke="#26324A" stroke-width="1.3" stroke-linejoin="round"></path></svg>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; height: 96px; display: flex; justify-content: center">
    <sc-if value="{{solved}}" hint-placeholder-val="{{false}}">
      <button type="button" onClick="{{next}}" aria-label="Next" style="width: 96px; height: 96px; border-radius: 50%; border: none; background: #158048; box-shadow: 0 6px 0 #0F5F35; display: flex; align-items: center; justify-content: center; color: #FFFFFF; cursor: pointer; animation: pop 0.4s ease-out both">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const pics = {
      duck: { img: '../../assets/illustrations/png/duck.png', label: 'Duck', first: 'ب', rest: 'طة' },
      apple: { img: '../../assets/illustrations/png/apple.png', label: 'Apple', first: 'ت', rest: 'فاح' },
      lion: { img: '../../assets/illustrations/png/lion.png', label: 'Lion', first: 'أ', rest: 'سد' },
      fox: { img: '../../assets/illustrations/png/fox.png', label: 'Fox', first: 'ث', rest: 'علب' }
    };
    const rounds = [
      { target: 'duck', opts: ['apple', 'duck'], en: 'Where’s the duck?', ar: 'أين البطة؟' },
      { target: 'lion', opts: ['lion', 'fox'], en: 'Where’s the lion?', ar: 'أين الأسد؟' },
      { target: 'apple', opts: ['fox', 'apple'], en: 'Where’s the apple?', ar: 'أين التفاح؟' }
    ];
    const ri = st.round || 0;
    const r = rounds[ri];
    const solved = !!st.solved;
    const miss = st.miss || 0;
    const missed = st.missed || null;
    const tiles = r.opts.map((id) => {
      const isT = id === r.target;
      let anim = 'none';
      if (solved && isT) anim = 'yay 0.6s ease-out both';
      else if (!solved && miss > 0 && isT) anim = (miss % 2 ? 'wigA' : 'wigB') + ' 0.8s ease 0.3s';
      else if (!solved && miss > 0 && id === missed) anim = (miss % 2 ? 'nudgeA' : 'nudgeB') + ' 0.4s ease';
      return {
        ...pics[id],
        anim,
        party: solved && isT,
        bg: solved && isT ? '#DFF5D5' : '#FFFFFF',
        border: solved && isT ? '#3BAA5C' : '#FFFFFF',
        shadow: solved && isT ? '#9FD58A' : '#CFE2F7',
        pick: () => {
          if (solved) return;
          if (isT) this.setState({ solved: true });
          else this.setState({ miss: miss + 1, missed: id });
        }
      };
    });
    return {
      r,
      tiles,
      solved,
      dots: rounds.map((_, k) => ({ fill: k < ri || (k === ri && solved) ? '#FFC93C' : '#FFFFFF' })),
      say: () => this.setState({ miss: 0 }),
      next: () => this.setState({ round: (ri + 1) % rounds.length, solved: false, miss: 0, missed: null })
    };
  }
}
</script>
</body>
</html>
