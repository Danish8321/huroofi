<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Toddler picture cards</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
@keyframes wigA{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-8deg) scale(1.08)}75%{transform:rotate(8deg) scale(1.08)}}
@keyframes wigB{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-8deg) scale(1.08)}75%{transform:rotate(8deg) scale(1.08)}}
@keyframes talk{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', 'Noto Sans Arabic', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 30px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="ToddlerHome.dc.html" aria-label="Home" style="width: 68px; height: 68px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 5px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #13294B">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
    </a>
    <a href="ParentGate.dc.html" aria-label="Grown-ups: press and hold to open settings" style="width: 44px; height: 44px; border-radius: 50%; background: #D5E2F0; display: flex; align-items: center; justify-content: center; color: #4A5D7A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    </a>
  </div>

  <div style="margin-top: 18px; background: {{c.ring}}; border-radius: 40px; padding: 8px; box-shadow: 0 8px 0 #CFE2F7">
    <div style="position: relative; background: #FFFFFF; border-radius: 34px; padding: 18px 16px 20px; display: flex; flex-direction: column; align-items: center">
      <span dir="rtl" style="min-width: 150px; height: 136px; border-radius: 36px; background: {{c.pastel}}; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 110px; font-weight: 700; line-height: 1; color: #13294B; padding-bottom: 14px; box-sizing: border-box">{{c.letter}}</span>
      <sc-if value="{{talking}}" hint-placeholder-val="{{false}}">
        <span style="position: absolute; top: 24px; left: 20px; display: flex; align-items: center; gap: 4px" aria-hidden="true">
          <span style="width: 6px; height: 24px; border-radius: 3px; background: {{c.ring}}; animation: talk 0.8s ease-in-out infinite"></span>
          <span style="width: 6px; height: 24px; border-radius: 3px; background: {{c.ring}}; animation: talk 0.8s ease-in-out 0.2s infinite"></span>
          <span style="width: 6px; height: 24px; border-radius: 3px; background: {{c.ring}}; animation: talk 0.8s ease-in-out 0.4s infinite"></span>
        </span>
      </sc-if>
      <button type="button" onClick="{{tapPic}}" aria-label="{{c.say}}" style="margin-top: 10px; width: 226px; height: 226px; border: none; border-radius: 50%; background: {{c.pastel}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <img src="{{c.img}}" alt="" style="width: 196px; height: 196px; object-fit: contain; animation: {{anim}}">
      </button>
      <div dir="rtl" style="margin-top: 4px; font-family: 'Noto Naskh Arabic', serif; font-size: 88px; font-weight: 700; line-height: 1.3"><span style="color: {{c.dark}}">{{c.first}}</span>{{c.rest}}</div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
    <button type="button" onClick="{{prev}}" aria-label="Previous picture" style="width: 96px; height: 96px; border-radius: 50%; border: none; background: #FFFFFF; box-shadow: 0 6px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #13294B; cursor: pointer">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="display: flex; gap: 10px" aria-hidden="true">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: {{d.bg}}"></span>
      </sc-for>
    </div>
    <button type="button" onClick="{{next}}" aria-label="Next picture" style="width: 96px; height: 96px; border-radius: 50%; border: none; background: #1F6FE0; box-shadow: 0 6px 0 #1555B0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; cursor: pointer">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const cards = [
      { letter: 'أ', first: 'أ', rest: 'سد', img: '../../assets/illustrations/png/lion.png', say: 'Lion, asad' },
      { letter: 'ب', first: 'ب', rest: 'طة', img: '../../assets/illustrations/png/duck.png', say: 'Duck, baṭṭa' },
      { letter: 'ت', first: 'ت', rest: 'فاح', img: '../../assets/illustrations/png/apple.png', say: 'Apple, tuffāḥ' },
      { letter: 'ث', first: 'ث', rest: 'علب', img: '../../assets/illustrations/png/fox.png', say: 'Fox, thaʿlab' }
    ].map((c) => ({ ...c, ring: '#F59E0B', pastel: '#FFEDC4', dark: '#A35400' }));
    const i = st.i || 0;
    const taps = st.taps || 0;
    const go = (d) => this.setState({ i: (i + d + cards.length) % cards.length, taps: 0 });
    return {
      c: cards[i],
      dots: cards.map((_, k) => ({ bg: k === i ? '#1F6FE0' : '#C9D6E6' })),
      talking: taps > 0,
      anim: taps === 0 ? 'none' : (taps % 2 ? 'wigA 0.7s ease' : 'wigB 0.7s ease'),
      tapPic: () => this.setState({ taps: taps + 1 }),
      prev: () => go(-1),
      next: () => go(1)
    };
  }
}
</script>
</body>
</html>
