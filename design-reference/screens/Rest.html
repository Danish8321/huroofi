/* Layout: review shell (screen list · device · notes) around a 390 × 844 phone that renders the app at real size. */
:root {
  /* review shell */
  --bg: #EEF2F7; --panel: #FFFFFF; --ink: #13294B; --ink-2: #4A5D7A; --line: #D5E2F0; --accent: #1F6FE0; --accent-ink: #FFFFFF; --chip: #E8F0FB; --bezel: #13294B;
  /* app tokens (HANDOFF §5); the app itself has one light look */
  --navy: #13294B; --muted: #4A5D7A; --sky: #E8F4FF; --card: #FFFFFF; --primary: #1F6FE0; --primary-d: #1555B0;
  --sun: #FFC93C; --sun-d: #E0A400; --success: #158048; --success-d: #0F5F35; --guide: #C8DCF4; --parent-bg: #F4F7FB;
  --almost: #FFE4D6; --almost-ink: #8A3B12; --rest: #24345E;
  --app-en: 'Baloo Bhaijaan 2', 'HBaloo', system-ui, sans-serif;
  --app-ar: 'HNaskh', 'Noto Naskh Arabic', serif;
  --shell: 'Baloo Bhaijaan 2', 'HBaloo', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1626; --panel: #16223A; --ink: #E6EEF9; --ink-2: #A9B9D2; --line: #2A3A58; --accent: #6AA6FF; --accent-ink: #0E1626; --chip: #1F2E4C; --bezel: #04070D; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0E1626; --panel: #16223A; --ink: #E6EEF9; --ink-2: #A9B9D2; --line: #2A3A58; --accent: #6AA6FF; --accent-ink: #0E1626; --chip: #1F2E4C; --bezel: #04070D; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--shell) }
button { font-family: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.ar { font-family: var(--app-ar); font-weight: 700 }

/* ---------- shell ---------- */
#shell { display: grid; grid-template-columns: 250px minmax(0, 1fr) 320px; gap: 20px; padding-block: 16px; padding-inline: 16px; min-height: 100vh; align-items: start }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; min-width: 0 }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px }
.brand b { font-size: 22px; font-weight: 800 }
.brand .ar { font-size: 22px; color: var(--accent) }
.brand-sub { margin: 0 0 14px; font-size: 14px; color: var(--ink-2); line-height: 1.35 }
.view-tabs { display: flex; gap: 6px; margin-bottom: 14px }
.view-tabs button { flex: 1; height: 38px; white-space: nowrap; font-size: 13px !important; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 700; cursor: pointer }
.view-tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.nav-group h3 { margin: 14px 0 6px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2) }
.nav-link { display: block; width: 100%; text-align: left; padding: 7px 10px; border: none; border-radius: 9px; background: transparent; font-size: 15px; font-weight: 600; cursor: pointer }
.nav-link:hover { background: var(--chip) }
.nav-link.on { background: var(--chip); color: var(--accent); font-weight: 800 }
.ctl { display: grid; gap: 12px }
.ctl label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink-2) }
.ctl select { height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 15px; padding: 0 8px }
.ctl .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink) }
.ctl .check input { width: 18px; height: 18px; accent-color: var(--accent) }
.ctl-btns { display: flex; gap: 8px }
.ctl-btns button { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); font-size: 14px; font-weight: 800; cursor: pointer }
#progress-line { margin: 0; font-size: 13px; color: var(--ink-2) }
.stage-col { min-width: 0; display: grid; gap: 10px; justify-items: center }
.stage-screens { width: 100%; display: grid; gap: 10px; justify-items: center }
#stage { width: 100%; display: grid; justify-items: center }
.feedback { display: flex; align-items: center; gap: 8px; min-height: 44px; width: min(100%, 560px); padding: 6px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; flex-wrap: wrap }
#caption { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0 }
#caption svg { width: 18px; height: 18px; color: var(--accent); flex-shrink: 0 }
#caption .cap-label { font-weight: 800; color: var(--ink-2) }
#caption .clip { background: var(--chip); border-radius: 8px; padding: 0 8px; font-weight: 700 }
#caption .clip .ar { font-size: 17px }
#caption .then { color: var(--ink-2); font-size: 12px }
#caption.flash { animation: flash 0.6s ease-out }
@keyframes flash { from { background: var(--chip) } to { background: transparent } }
#buzz { font-size: 13px; font-weight: 800; color: var(--ink-2); opacity: 0 }
#buzz.show { animation: buzz 1.4s ease-out }
@keyframes buzz { 0% { opacity: 1; transform: translateX(-2px) } 10% { transform: translateX(2px) } 20% { transform: translateX(-2px) } 30% { transform: translateX(0) } 80% { opacity: 1 } 100% { opacity: 0 } }
#device-holder { position: relative }
#device { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 12px; border-radius: 52px; background: var(--bezel); box-shadow: 0 20px 50px rgba(19, 41, 75, 0.25) }
#device.tablet { border-radius: 40px }
#device .screen { width: 390px; height: 844px; border-radius: 40px }
#device.tablet .screen { width: 1180px; height: 820px; border-radius: 28px }
#device-note { margin: 0; font-size: 13px; color: var(--ink-2) }
.notes { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; position: sticky; top: 16px; min-width: 0 }
.notes h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; text-wrap: balance }
.notes p { margin: 0 0 10px; font-size: 14px; color: var(--ink-2); line-height: 1.4 }
.notes p b { color: var(--ink) }
.notes code { font-size: 13px; background: var(--chip); padding: 1px 6px; border-radius: 6px; color: var(--ink) }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 8px }
.notes li { font-size: 15px; line-height: 1.4 }
.notes .ar { font-size: 17px }
.ds { width: 100%; max-width: 900px; display: grid; gap: 18px }
.ds section { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0 }
.ds h2 { margin: 0 0 12px; font-size: 20px; font-weight: 800 }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px }
.swatch { display: grid; gap: 2px; font-size: 13px }
.swatch span { height: 46px; border-radius: 12px; border: 1px solid var(--line) }
.swatch code { color: var(--ink-2) }
.swatch small { color: var(--ink-2) }
.stage-fams { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px }
.fam { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 2px 10px; padding: 10px; border: 4px solid; border-radius: 18px; color: #13294B }
.fam img { width: 44px; height: 44px; grid-row: span 2 }
.fam .ar { font-size: 20px }
.type-scale p { margin: 0 0 8px; color: var(--ink) }
.type-scale small { color: var(--ink-2) }
.ds-demo { display: grid; gap: 14px; padding: 18px; border-radius: 16px; background: var(--sky); max-width: 380px; position: static; width: auto !important; height: auto !important }
.ds-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.ds-rules { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 15px; line-height: 1.4 }

@media (max-width: 1180px) {
  #shell { grid-template-columns: 230px minmax(0, 1fr) }
  .notes { grid-column: 1 / -1; position: static }
}
@media (max-width: 760px) {
  #shell { grid-template-columns: minmax(0, 1fr) }
  .side { position: static; max-height: none }
  .screen-list-wrap { display: flex; flex-wrap: wrap; gap: 4px 12px }
}

/* ---------- static snapshot mode ---------- */
body.static { background: #FFFFFF; padding: 0 }
body.static .screen { width: 390px; height: 844px }
body.static .screen.static-tablet { width: 1180px; height: 820px }

/* =========================================================
   App screens. Units are dp at 1:1.
   ========================================================= */
.screen { position: relative; overflow: hidden; background: var(--sky); color: var(--navy); font-family: var(--app-en); -webkit-tap-highlight-color: transparent; user-select: none }
.screen button { cursor: pointer; border: none; background: none; padding: 0; color: inherit; font-family: inherit }
.screen img { max-width: none }
.screen svg { display: block }

/* shared controls */
.sun-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--sun) !important; box-shadow: 0 5px 0 var(--sun-d); display: inline-flex; align-items: center; justify-content: center; color: var(--navy); flex-shrink: 0 }
.sun-btn svg { width: 28px; height: 28px }
.sun-btn.big { width: 64px; height: 64px }
.round-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--card) !important; box-shadow: 0 4px 0 #CFE2F7; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0 }
.round-btn svg { width: 26px; height: 26px }
.square-btn { width: 64px; height: 64px; border-radius: 22px; background: var(--card) !important; border: 3px solid #A9CBF2 !important; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--navy) }
.square-btn svg { width: 30px; height: 30px }
.primary-btn { height: 64px; border-radius: 22px; background: var(--primary) !important; box-shadow: 0 6px 0 var(--primary-d); color: #FFFFFF !important; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: 800; padding: 0 20px !important; width: 100% }
.primary-btn svg { width: 26px; height: 26px; flex-shrink: 0 }
.primary-btn .btn-ar { font-size: 30px; line-height: 1 }
.primary-btn.small { height: 56px; font-size: 20px; border-radius: 20px }
.primary-btn.success { background: var(--success) !important; box-shadow: 0 6px 0 var(--success-d) }
.primary-btn.sun { background: var(--sun) !important; box-shadow: 0 6px 0 var(--sun-d); color: var(--navy) !important }
.primary-btn.locked { background: #D5E0EC !important; box-shadow: 0 6px 0 #BCCADB; color: #4A5D7A !important; cursor: default }
.primary-btn.locked svg { width: 22px; height: 22px }
.primary-btn.ready { animation: ready 1.6s ease-in-out infinite }
@keyframes ready { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.03) } }
.parent-lock { width: 48px; height: 48px; border-radius: 50%; background: rgba(19, 41, 75, 0.08) !important; color: #4A5D7A; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0 }
.parent-lock svg { width: 22px; height: 22px }
.parent-lock.corner { position: absolute; right: 18px; top: 18px; z-index: 2 }
.bubble { display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px !important; border-radius: 28px; background: var(--card) !important; box-shadow: 0 4px 0 #CFE2F7; min-height: 76px }
.bubble-ar { font-size: 34px; line-height: 1.4 }
.leo-row { display: flex; align-items: center; gap: 12px }
.leo { width: 96px; height: 96px; object-fit: contain; flex-shrink: 0 }
.leo-row.small .leo { width: 70px; height: 70px }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: #FFFFFF; border: 3px solid var(--sun); overflow: hidden; flex-shrink: 0; display: block }
.avatar img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.15) }
.avatar.small { width: 48px; height: 48px }

/* motion */
.wiggle { animation: wiggle 0.6s ease-in-out }
@keyframes wiggle { 0%, 100% { transform: rotate(0) } 20% { transform: rotate(-6deg) scale(1.04) } 40% { transform: rotate(6deg) scale(1.04) } 60% { transform: rotate(-4deg) } 80% { transform: rotate(3deg) } }
.nudge { animation: nudge 0.4s ease-in-out }
@keyframes nudge { 0%, 100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
.burst { position: absolute; inset: 0; pointer-events: none; z-index: 3 }
.burst-star { position: absolute; left: 50%; top: var(--top); animation: burst 0.9s cubic-bezier(.2, .9, .3, 1.2) both, twinkle 1.6s ease-in-out infinite }
@keyframes burst { 0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0 } 25% { opacity: 1 } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity: 1 } }
@keyframes twinkle { 0%, 100% { filter: brightness(1) } 50% { filter: brightness(1.25) } }
.screen.calm *, .screen.calm *::before { animation-duration: 0s !important; animation-iteration-count: 1 !important }
@media (prefers-reduced-motion: reduce) { .screen *, .screen *::before { animation-duration: 0s !important; animation-iteration-count: 1 !important } }

/* ---------- toddler ---------- */
.t-wrap { height: 100%; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 26px; position: relative }
.t-top { display: flex; align-items: center; gap: 12px }
.t-top .parent-lock { margin-left: auto }
.t-home { width: 64px; height: 64px; border-radius: 22px; background: #FFFFFF !important; box-shadow: 0 5px 0 #CFE2F7; display: inline-flex; align-items: center; justify-content: center; color: var(--primary) }
.t-home svg { width: 32px; height: 32px }
.screen-thome .t-wrap { padding-top: 24px }
.screen-thome .leo-row { padding-right: 52px }
.tile { flex: 1; position: relative; display: flex; align-items: center; gap: 10px; padding: 0 22px 0 16px !important; border-radius: 36px; border: 5px solid !important; min-height: 0 }
.tile-cards { background: #FFEDC4 !important; border-color: #F59E0B !important; box-shadow: 0 8px 0 #C77F00 }
.tile-find { background: #DAEAFF !important; border-color: #2F80ED !important; box-shadow: 0 8px 0 #0B4FB0 }
.tile-paint { background: #FFDDEA !important; border-color: #EC4F8C !important; box-shadow: 0 8px 0 #B83A6B }
.tile-art { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 100% }
.tile-ar { font-size: 44px; line-height: 1.4; min-width: 100px; text-align: center }
.tile-cards .tile-ar { color: #A35400 } .tile-find .tile-ar { color: #0B4FB0 } .tile-paint .tile-ar { color: #B0185A }
.tile-go { position: absolute; right: 16px; bottom: 14px; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #FFFFFF }
.tile-go svg { width: 22px; height: 22px }
.tile-cards .tile-go { background: #F59E0B } .tile-find .tile-go { background: #2F80ED } .tile-paint .tile-go { background: #EC4F8C }
.mini-card { width: 84px; height: 112px; border-radius: 18px; background: #FFFFFF; border: 4px solid #F59E0B; display: flex; align-items: center; justify-content: center }
.mini-card img { width: 66px; height: 66px; object-fit: contain }
.tilt-l { transform: rotate(-8deg) translateX(10px) } .tilt-r { transform: rotate(6deg) }
.mini-pic { position: relative; width: 84px; height: 84px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center }
.mini-pic img { width: 62px; height: 62px; object-fit: contain }
.mini-pic.ok { border: 4px solid var(--success) }
.mini-pic svg { position: absolute; right: -10px; top: -14px }
.mini-paint { width: 150px; height: 104px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 70px; color: #FF7A59; line-height: 1 }
/* look & listen */
.big-card { flex: 1; position: relative; border-radius: 40px; border: 8px solid; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transform: rotate(-1deg); touch-action: pan-y }
.card-letter { position: absolute !important; right: 18px; top: 18px; width: 76px; height: 76px; border-radius: 22px; font-size: 44px; line-height: 1; display: flex; align-items: center; justify-content: center }
.card-pic img { width: 230px; height: 230px; object-fit: contain }
.card-word { font-size: 64px; line-height: 1.3 }
.card-sound { position: absolute !important; left: 22px; bottom: 22px; width: 64px !important; height: 64px !important }
.card-nav { display: flex; align-items: center; justify-content: space-between }
.arrow { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center }
.arrow svg { width: 40px; height: 40px }
.arrow.prev { background: #FFFFFF !important; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12) }
.arrow.next { background: var(--primary) !important; box-shadow: 0 6px 0 var(--primary-d); color: #FFFFFF }
.peek { display: flex; gap: 6px }
.peek img { width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, 0.8); object-fit: contain; padding: 4px }
/* find */
.find-bubble { flex: 1; justify-content: space-between }
.find-cards { flex: 1; display: grid; grid-template-rows: 1fr 1fr; gap: 20px; min-height: 0 }
.find-card { position: relative; border-radius: 40px; background: #FFFFFF !important; box-shadow: 0 8px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; border: 8px solid transparent !important; min-height: 0 }
.find-card img { width: 190px; height: 190px; object-fit: contain }
.find-card.right { border-color: var(--success) !important; box-shadow: 0 8px 0 var(--success-d) }
.find-card.faded { opacity: 0.5 }
.find-foot { height: 96px; display: flex; align-items: center; justify-content: center }
.t-hint { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 18px; font-weight: 700; color: var(--muted) }
.t-hint svg { width: 26px; height: 26px }
.fill-next { position: relative; width: 100%; height: 96px; border-radius: 30px; overflow: hidden; background: var(--success) !important; box-shadow: 0 7px 0 var(--success-d); color: #FFFFFF }
.fill-next .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #22A05C; animation: fillbar 4s 1s linear both }
@keyframes fillbar { from { width: 0 } to { width: 100% } }
.fill-icon { position: relative; display: flex; justify-content: center }
.fill-icon svg { width: 48px; height: 48px }
.ring-next { position: relative; width: 120px; height: 120px; border-radius: 50%; flex-shrink: 0 }
.ring-next > svg { position: absolute; inset: 0; width: 120px; height: 120px }
.ring-track { fill: none; stroke: rgba(19, 41, 75, 0.12); stroke-width: 8 }
.ring-fill { fill: none; stroke: var(--success); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 100 100; transform: rotate(-90deg); transform-origin: 60px 60px; animation: countdown 4s 1s linear both }
@keyframes countdown { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
.ring-btn { position: absolute; inset: 14px; border-radius: 50%; background: var(--success); box-shadow: 0 5px 0 var(--success-d); display: flex; align-items: center; justify-content: center; color: #FFFFFF }
.ring-btn svg { width: 48px; height: 48px }
.tablet-find { flex-direction: row; gap: 28px; padding: 28px }
.tf-side { width: 300px; display: flex; flex-direction: column; gap: 24px }
.tf-side .bubble { flex-direction: column; padding: 22px !important; border-radius: 36px; flex: 0 }
.tf-side .bubble-ar { font-size: 52px }
.tf-foot { margin-top: auto; display: flex; align-items: flex-end; gap: 16px }
.tf-foot .leo { width: 150px; height: 150px }
.tf-cards { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 28px }
.tf-cards .find-card img { width: 300px; height: 300px }
/* paint */
.paint-wrap { background: #FFDDEA }
.paint-wrap .t-home { color: #B0185A; box-shadow: 0 5px 0 #F2B5CC }
.paint-card { flex: 1; position: relative; border-radius: 44px; background: #FFFFFF; border: 8px solid #EC4F8C; box-shadow: 0 8px 0 #B83A6B; overflow: hidden; min-height: 0 }
.paint-wrap.done .paint-card { border-color: var(--success); box-shadow: 0 8px 0 var(--success-d) }
.paint-svg { width: 100%; height: 100%; touch-action: none }
.cheer-leo { position: absolute; right: 12px; bottom: 12px; width: 104px; height: 104px; object-fit: contain; animation: hop 0.6s 0.4s ease-out both, cheer 1.2s 1s ease-in-out infinite; z-index: 4 }
@keyframes hop { 0% { transform: translateY(60px); opacity: 0 } 100% { transform: translateY(0); opacity: 1 } }
@keyframes cheer { 0%, 100% { transform: translateY(0) rotate(-4deg) } 50% { transform: translateY(-8px) rotate(4deg) } }
.crayons { display: flex; align-items: flex-end; justify-content: space-between }
.crayon { width: 72px; height: 72px; border-radius: 50%; border: 6px solid #FFFFFF !important }
.crayon.on { border-color: var(--navy) !important; transform: translateY(-12px) }
.wipe { align-self: center; width: 76px; height: 64px; border-radius: 999px; background: #FFFFFF !important; box-shadow: 0 5px 0 #F2B5CC; color: #B0185A; display: flex; align-items: center; justify-content: center }
.wipe svg { width: 28px; height: 28px }
.paint-done-row { height: 156px; display: flex; align-items: center; justify-content: center; gap: 24px }
.paint-again { width: 72px !important; height: 72px !important; color: #B0185A }
.paint-again svg { width: 30px; height: 30px }

.demo-hand { pointer-events: none }

/* ---------- learn ---------- */
.learn-wrap { height: 100%; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 0; position: relative }
.learn-wrap.scroll { overflow-y: auto; padding-bottom: 0 }
.bottom-nav { margin: auto -20px 0; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -4px 16px rgba(19, 41, 75, 0.08); display: flex; justify-content: space-around; padding: 10px 8px 16px; position: sticky; bottom: 0; z-index: 5 }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; min-height: 52px; color: var(--muted); font-size: 16px; font-weight: 700 }
.nav-item svg { width: 28px; height: 28px }
.nav-item.on { color: var(--primary); font-weight: 800 }
.home-head { display: flex; align-items: center; gap: 12px; padding-top: 4px }
.home-hello { display: flex; flex-direction: column }
.home-hello b { font-size: 24px; font-weight: 800; line-height: 1.1 }
.home-hello span { font-size: 16px; font-weight: 600; color: var(--muted) }
.path-card { flex: 1; position: relative; border-radius: 36px; border: 5px solid; overflow: hidden; min-height: 0 }
.path-card > svg { position: absolute; inset: 0; width: 100%; height: 100% }
.node { position: absolute; width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; line-height: 1 }
.node.learned { background: var(--success); color: #FFFFFF; box-shadow: 0 5px 0 var(--success-d) }
.node.togo { background: #FFFFFF; border: 3px solid }
.node.today { width: 112px !important; height: 112px !important; background: var(--primary) !important; color: #FFFFFF; box-shadow: 0 7px 0 var(--primary-d); font-size: 58px; animation: pulse 2.4s ease-in-out infinite }
@keyframes pulse { 0%, 100% { box-shadow: 0 7px 0 var(--primary-d), 0 0 0 0 rgba(31, 111, 224, 0.35) } 50% { box-shadow: 0 7px 0 var(--primary-d), 0 0 0 16px rgba(31, 111, 224, 0) } }
.today-chip { position: absolute; padding: 2px 12px; border-radius: 999px; background: #FFFFFF; font-size: 16px; font-weight: 800; color: var(--primary-d) }
.node-pic { position: absolute !important; width: 88px; height: 88px }
.node-pic img { width: 88px; height: 88px; object-fit: contain }
.prize { position: absolute; right: 18px; top: 18px }
.go-btn { flex-shrink: 0 }
.sticker { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: #FFFFFF; border: 6px solid; flex-shrink: 0 }
.sticker img { width: 76%; height: 76%; object-fit: contain }
.sticker.empty { border-style: dashed; border-width: 4px; font-size: 34px; font-weight: 800; box-shadow: none }
.page-head { display: flex; flex-direction: column; padding-top: 4px }
.page-head h1 { margin: 0; font-size: 30px; font-weight: 800; line-height: 1.1 }
.page-head span { font-size: 16px; font-weight: 600; color: var(--muted) }
/* map */
.map-list { position: relative; display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px }
.map-line { position: absolute; left: 41px; top: 40px; bottom: 60px; border-left: 6px dotted #A9CBF2 }
.map-card { position: relative; width: 100%; text-align: left; border-radius: 30px; background: #F4F7FB !important; border: 4px solid #FFFFFF !important; box-shadow: 0 6px 0 #CFE2F7; padding: 12px 14px !important; display: flex; flex-direction: column; gap: 10px }
.map-card.current { border: 4px solid !important }
.map-card.finished { background: #FFFFFF !important; border-color: var(--success) !important; box-shadow: 0 6px 0 var(--success-d) }
.map-card.open { background: #FFFFFF !important }
.map-row { display: flex; align-items: center; gap: 12px }
.map-pic { width: 56px; height: 56px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0 }
.map-pic img { width: 46px; height: 46px; object-fit: contain }
.map-card.locked .map-pic { opacity: 0.6 }
.map-name { flex: 1; display: flex; flex-direction: column; min-width: 0 }
.map-num { font-size: 16px; font-weight: 700; color: var(--muted) }
.map-name b { font-size: 20px; font-weight: 800; line-height: 1.1 }
.map-chars { align-self: flex-start; font-size: 20px; line-height: 1.5; color: var(--muted) }
.map-count { padding: 2px 12px; border-radius: 999px; background: #FFFFFF; font-size: 16px; font-weight: 800 }
.map-badge { width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0 }
.map-badge svg { width: 20px; height: 20px }
.map-badge.done { background: var(--success); color: #FFFFFF }
.map-badge.play { width: 52px; height: 52px; background: var(--primary); color: #FFFFFF; box-shadow: 0 4px 0 var(--primary-d) }
.map-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px }
.map-chip { height: 72px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 40px; line-height: 1; color: var(--muted) }
.map-chip.learned { background: var(--success); color: #FFFFFF }
.map-chip.learning { border: 4px solid var(--primary); color: var(--navy) }
/* stickers */
.sticker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-bottom: 20px }
.sticker-slot { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px !important; border-radius: 28px; background: #FFFFFF !important; box-shadow: 0 5px 0 #CFE2F7; font-size: 18px }
.sticker-slot b { font-weight: 800 }
.sticker-slot.empty { background: rgba(255, 255, 255, 0.6) !important; box-shadow: none; color: var(--muted); font-weight: 700 }
.sticker-slot:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 7px) }
/* flow header */
.flow-head { display: flex; align-items: center; gap: 12px }
.practice-title { font-size: 22px; font-weight: 800 }
.steps { flex: 1; display: flex; align-items: center }
.step { height: 40px; min-width: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-shrink: 0 }
.step svg { width: 20px; height: 20px }
.step.done { background: var(--success); color: #FFFFFF }
.step.now { background: var(--primary); color: #FFFFFF; padding: 0 14px 0 6px }
.step.now svg { width: 28px; height: 28px; padding: 5px; border-radius: 50%; background: #FFFFFF; color: var(--primary) }
.step.now b { font-size: 16px; font-weight: 800 }
.step.todo { background: #FFFFFF; color: var(--muted) }
.step-line { flex: 1; height: 4px; background: #D5E2F0; border-radius: 2px }
.step-line.done { background: var(--success) }
/* lesson */
.letter-card { position: relative; flex: 1; border-radius: 36px; border: 6px solid; display: flex; align-items: center; justify-content: center; min-height: 0 }
.letter-name { position: absolute; left: 20px; top: 16px; font-size: 18px; display: flex; gap: 6px; align-items: baseline }
.letter-name b { font-weight: 800 }
.letter-name .ar { font-size: 22px; color: var(--muted) }
.lesson-sound { position: absolute !important; right: 16px; top: 16px; width: 64px !important; height: 64px !important }
.big-letter { font-size: 170px; line-height: 1.2; color: var(--navy) }
.reader .big-letter { font-size: 140px }
.word-card { display: flex; align-items: center; gap: 14px; padding: 10px 18px 10px 10px !important; border-radius: 28px; background: #FFFFFF !important; box-shadow: 0 5px 0 #CFE2F7; text-align: right }
.word-pic { width: 104px; height: 104px; border-radius: 22px; background: var(--sky); display: flex; align-items: center; justify-content: center; flex-shrink: 0 }
.word-pic img { width: 84px; height: 84px; object-fit: contain }
.word-text { flex: 1; display: flex; flex-direction: column; align-items: flex-end }
.lesson-word { font-size: 48px; line-height: 1.3 }
.meaning { font-size: 18px; font-weight: 700; color: var(--muted) }
.shapes-card { border-radius: 26px; background: #FFFFFF; padding: 12px; display: flex; flex-direction: column; gap: 10px }
.shapes-head { display: flex; justify-content: space-between; align-items: center; font-size: 18px }
.shapes-head .ar { font-size: 22px }
.reader-chip { padding: 2px 12px; border-radius: 999px; background: #E8E0FF; color: #4C2DB0; font-size: 16px; font-weight: 800 }
.shapes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px }
.shape { height: 84px; border-radius: 18px; background: #F4F7FB; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 36px; line-height: 1.2 }
.shape.alone { background: #FFEDC4 }
.shape small { font-family: var(--app-en); font-size: 16px; font-weight: 700; color: var(--muted) }
.lesson-next { margin-bottom: 26px; flex-shrink: 0 }
/* trace */
.hint-bubble { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px !important; border-radius: 28px; background: #FFFFFF !important; text-align: left; font-size: 18px; font-weight: 700; line-height: 1.25; min-height: 64px }
.hint-bubble.ok { background: #DDF3E4 !important }
.hint-ico { width: 48px; height: 48px; padding: 11px; border-radius: 50%; background: var(--sun); box-shadow: 0 4px 0 var(--sun-d); flex-shrink: 0 }
.trace-card { flex: 1; position: relative; border-radius: 36px; background: #FFFFFF; box-shadow: 0 6px 0 #CFE2F7; overflow: hidden; min-height: 0; border: 5px solid #FFFFFF }
.trace-card.done { border-color: var(--success); box-shadow: 0 6px 0 var(--success-d) }
.trace-svg { width: 100%; height: 100%; touch-action: none }
.tdot { fill: #FFFFFF; stroke: #13294B; stroke-width: 2 }
.tdot.on { fill: var(--success); stroke: #FFFFFF }
.tdot.later, .tarrow.later, .coin.later { opacity: 0.35 }
.coin.next circle { animation: coin 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
@keyframes coin { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.18) } }
.done-badge { position: absolute; left: 0; right: 0; bottom: 18px; margin: 0 auto; width: max-content; display: flex; align-items: center; gap: 8px; padding: 6px 18px 6px 6px; border-radius: 999px; background: var(--success); color: #FFFFFF; font-size: 20px; font-weight: 800; z-index: 4; animation: hop 0.5s 0.3s ease-out both }
.done-badge img { width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF }
.done-badge .ar { font-size: 26px; line-height: 1 }
.paints { display: flex; justify-content: space-between }
.paint { width: 56px; height: 56px; border-radius: 50%; border: 5px solid #FFFFFF !important; box-shadow: 0 3px 0 #CFE2F7 }
.paint.on { border-color: var(--navy) !important }
.trace-foot { display: flex; gap: 12px; padding-bottom: 26px }
.trace-foot .primary-btn { flex: 1 }
/* quiz */
.quiz-head { display: flex; align-items: center; justify-content: space-between }
.qdots { display: flex; gap: 8px; align-items: center }
.qdot { width: 14px; height: 14px; border-radius: 999px; background: #C9D6E6 }
.qdot.now { width: 36px; background: var(--primary) }
.qdot.done { background: var(--success) }
.head-gap { width: 52px }
.q-bubble { flex: 1; gap: 10px !important; padding-right: 10px !important }
.q-ask { flex: 1; text-align: left; font-size: 20px; font-weight: 800; line-height: 1.15 }
.q-letter { width: 52px; height: 52px; border-radius: 16px; background: #FFF4D6; border: 3px solid var(--sun); display: flex; align-items: center; justify-content: center; font-size: 34px; line-height: 1; color: #A35400 }
.q-cards { flex: 1; display: grid; grid-auto-rows: 1fr; gap: 16px; min-height: 0 }
.four .q-cards { grid-template-columns: 1fr 1fr }
.q-card { position: relative; border-radius: 32px; background: #FFFFFF !important; box-shadow: 0 6px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; gap: 12px; border: 6px solid transparent !important; min-height: 0 }
.q-card img { width: 120px; height: 120px; object-fit: contain }
.four .q-card img { width: 110px; height: 110px }
.q-card.right { border-color: var(--success) !important; box-shadow: 0 6px 0 var(--success-d) }
.q-card.dim { opacity: 0.45 }
.q-card.faded { opacity: 0.5 }
.q-word { font-size: 44px; line-height: 1.3 }
.four .q-word { position: absolute; bottom: 4px; font-size: 30px }
.four .q-card.right img { transform: translateY(-14px) }
.q-star { position: absolute; right: -6px; top: -12px; animation: pop 0.5s cubic-bezier(.2, .9, .3, 1.4) both }
@keyframes pop { from { transform: scale(0) rotate(-30deg) } to { transform: scale(1) rotate(0) } }
.q-foot { min-height: 64px; display: flex; align-items: center; justify-content: center; padding-bottom: 26px; flex-shrink: 0 }
.q-hint { margin: 0; height: 64px; width: 100%; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700; color: var(--muted) }
.q-hint svg { width: 24px; height: 24px }
.almost { width: 100%; min-height: 64px; border-radius: 22px; background: var(--almost); color: var(--almost-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 12px; text-align: center }
.almost b { font-size: 20px; font-weight: 800 }
.almost span { font-size: 16px; font-weight: 700 }
.almost .ar { font-size: 20px }
/* reward */
.reward { align-items: center; overflow: hidden; padding-top: 26px }
.reward-title { margin: 0; font-size: 34px; font-weight: 800; text-align: center; text-wrap: balance }
.medal { position: relative; width: 250px; height: 250px; display: flex !important; align-items: center; justify-content: center; flex-shrink: 0 }
.rays { position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--ray) 35%, transparent) 0 12deg, transparent 12deg 30deg); animation: spin 18s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
.medal .sticker { position: relative; animation: pop 0.7s cubic-bezier(.2, .9, .3, 1.4) both }
.new-chip { position: absolute; bottom: 18px; padding: 4px 14px; border-radius: 999px; background: var(--navy); color: #FFFFFF; font-size: 16px; font-weight: 800; letter-spacing: 0.04em }
.reward-letters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: 100% }
.reward-letter { height: 96px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 32px; line-height: 1.2 }
.reward-letter img { width: 40px; height: 40px; object-fit: contain }
.reward-sub { margin: 0; font-size: 16px; font-weight: 700; color: var(--muted) }
.unlock-card { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px; border-radius: 28px; border: 4px solid }
.unlock-pic { width: 72px; height: 72px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0 }
.unlock-pic img { width: 56px; height: 56px; object-fit: contain }
.unlock-text { flex: 1; display: flex; flex-direction: column }
.unlock-text small { font-size: 14px; font-weight: 800; letter-spacing: 0.06em }
.unlock-text b { font-size: 22px; font-weight: 800 }
.unlock-ar { font-size: 24px; color: var(--muted) }
.reward-foot { margin-top: auto; width: 100%; display: flex; gap: 12px; padding-bottom: 26px }
.reward-foot .primary-btn { flex: 1 }
.reward-foot .square-btn { border-color: #F0CF6A !important; color: #A35400 }
.confetti { position: absolute; top: -20px; width: 12px; height: 22px; border-radius: 4px; animation: fall 3.4s linear infinite }
@keyframes fall { 0% { transform: translateY(0) rotate(0) } 100% { transform: translateY(900px) rotate(540deg) } }
/* gate */
.gate-wrap { height: 100%; background: #13294B; color: #FFFFFF; display: flex; flex-direction: column; padding: 18px 24px 30px }
.back-to-play { display: flex; align-items: center; gap: 16px; height: 84px; padding: 0 14px !important; border-radius: 28px; background: #FFFFFF !important; color: var(--navy) !important; box-shadow: 0 6px 0 #0A1A33; font-size: 22px }
.back-to-play b { flex: 1; text-align: left; font-weight: 800 }
.btp-ico { width: 56px; height: 56px; border-radius: 50%; background: var(--sky); color: var(--primary); display: flex; align-items: center; justify-content: center }
.btp-ico svg { width: 30px; height: 30px }
.back-to-play img { width: 56px; height: 56px }
.gate-body { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-top: 50px }
.gate-chip { padding: 4px 14px; border-radius: 999px; background: #1F3C68; color: #A9CBF2; font-size: 15px; font-weight: 800; letter-spacing: 0.06em }
.gate-body h1 { margin: 6px 0 0; font-size: 28px; font-weight: 800 }
.gate-body p { margin: 0; font-size: 17px; font-weight: 600; color: #C9DBF2; max-width: 290px }
.hold { position: relative; width: 220px; height: 220px; margin-top: 40px; touch-action: none }
.hold > svg { position: absolute; inset: 0; width: 220px; height: 220px }
.hold-track { fill: #1F3C68; stroke: #2B4F86; stroke-width: 14 }
.hold-ring { fill: none; stroke: var(--sun); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 100 100; stroke-dashoffset: 100; transform: rotate(-90deg); transform-origin: 110px 110px }
.hold-pad { position: absolute; inset: 36px; border-radius: 50%; background: var(--sun); box-shadow: 0 7px 0 var(--sun-d); color: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px }
.hold-pad svg { width: 44px; height: 44px }
.hold-pad b { font-size: 18px; font-weight: 800 }
.gate-actions { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 40px }
.ghost-btn { height: 56px; border-radius: 20px; border: 2px solid #3A5A8C !important; color: #C9DBF2 !important; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px }
.ghost-btn svg { width: 22px; height: 22px }
.gate-foot { margin: 0; text-align: center; font-size: 16px; font-weight: 600; color: #8FA9CC; min-height: 22px }
/* zone */
.zone-wrap { height: 100%; overflow-y: auto; background: var(--parent-bg); padding: 18px 18px 30px; display: flex; flex-direction: column; gap: 14px }
.zone-head { display: flex; align-items: center; gap: 10px }
.zone-head h1 { margin: 0; flex: 1; font-size: 26px; font-weight: 800 }
.zone-head .round-btn { display: none }
.btn-small { height: 48px; padding: 0 14px !important; border-radius: 14px; background: var(--primary) !important; color: #FFFFFF !important; display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; flex-shrink: 0 }
.btn-small svg { width: 20px; height: 20px }
.btn-small.ghost { background: #FFFFFF !important; color: var(--primary-d) !important; border: 1px solid #A9CBF2 !important }
.btn-small.warn { background: #A3361A !important }
.z-card { background: #FFFFFF; border-radius: 22px; border: 1px solid #D5E2F0; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px }
.z-card h2 { margin: 0; font-size: 20px; font-weight: 800 }
.z-card.list { padding-top: 6px; padding-bottom: 6px; gap: 0 }
.z-card.list h2 { padding-top: 8px }
.z-sub { font-size: 16px; font-weight: 600; color: var(--muted); margin-top: -8px }
.z-text { flex: 1; display: flex; flex-direction: column; min-width: 0 }
.z-text b { font-size: 18px; font-weight: 800; line-height: 1.2 }
.z-text b em { font-style: normal; font-weight: 600; color: var(--muted) }
.z-text > span { font-size: 16px; font-weight: 600; color: var(--muted); line-height: 1.25 }
.z-text .ar { font-size: 20px; color: var(--navy) }
.z-text small { font-size: 16px; color: var(--muted); line-height: 1.25; margin-top: 2px }
.z-text small.soon { color: #8A5A00 }
.child-row { display: flex; align-items: center; gap: 12px }
.z-bar { height: 12px; border-radius: 999px; background: #E3ECF7; overflow: hidden; display: flex }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 16px; font-weight: 700; color: var(--muted) }
.legend span { display: flex; align-items: center; gap: 6px }
.lg { width: 14px; height: 14px; border-radius: 4px; display: inline-block }
.lg.learned { background: var(--success) } .lg.learning { background: #FFFFFF; border: 3px solid var(--primary) } .lg.togo { background: #E3ECF7 }
.z-note { margin: 0; font-size: 16px; color: var(--muted) }
.z-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.z-letter { height: 42px; border-radius: 12px; background: #EEF3F9; display: flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1 }
.z-letter.learned { background: var(--success); color: #FFFFFF }
.z-letter.learning { background: #FFFFFF; border: 3px solid var(--primary) }
.mode { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 10px 14px !important; border-radius: 18px; border: 2px solid #E3ECF7 !important; text-align: left }
.mode.on { border-color: var(--primary) !important; background: #EEF5FF !important }
.radio { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #9AAAC0; display: flex; align-items: center; justify-content: center; flex-shrink: 0 }
.radio span { width: 12px; height: 12px; border-radius: 50% }
.mode.on .radio { border-color: var(--primary) } .mode.on .radio span { background: var(--primary) }
.z-row { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 8px 0; border-bottom: 1px solid #EEF3F9 }
.z-row:last-child { border-bottom: none }
.switch { width: 60px; height: 36px; border-radius: 999px; background: #9AAAC0 !important; position: relative; flex-shrink: 0 }
.switch span { position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(19, 41, 75, 0.3); transition: left 0.15s }
.switch.on { background: var(--success) !important } .switch.on span { left: 28px }
.switch:disabled { opacity: 0.45; cursor: default }
.stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0 }
.stepper b { min-width: 64px; text-align: center; font-size: 18px; font-weight: 800 }
.step-btn { width: 48px; height: 48px; border-radius: 14px; border: 1px solid #A9CBF2 !important; background: #FFFFFF !important; color: var(--primary-d); display: flex; align-items: center; justify-content: center }
.step-btn svg { width: 22px; height: 22px }
.step-btn:disabled { opacity: 0.4 }
.confirm { display: flex; flex-direction: column; gap: 6px; padding: 12px 0 }
.confirm b { font-size: 18px } .confirm span { font-size: 16px; color: var(--muted) }
.confirm-btns { display: flex; gap: 10px; justify-content: flex-end }
.trust { margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; color: var(--muted) }
.trust svg { width: 20px; height: 20px; color: var(--success) }
/* rest */
.rest-wrap { height: 100%; background: linear-gradient(#24345E, #3A4F86); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; position: relative; text-align: center; padding: 24px }
.rest-wrap .parent-lock { background: rgba(255, 255, 255, 0.14) !important; color: #C9DBF2 }
.moon { position: absolute; left: 34px; top: 70px; width: 64px; height: 64px; color: #FFE07A }
.moon svg { width: 64px; height: 64px; fill: #FFE07A }
.rest-stars { position: absolute; right: 70px; top: 130px; display: flex; gap: 22px; opacity: 0.9 }
.rest-leo { width: 200px; height: 200px; object-fit: contain; filter: saturate(0.85) }
.rest-ar { font-size: 48px; line-height: 1.5 }
.rest-wrap p { margin: 0; font-size: 20px; font-weight: 700; color: #C9DBF2 }
.closed-wrap { height: 100%; background: #0A1A33; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 30px; text-align: center; font-size: 20px; font-weight: 700 }
.closed-wrap p { margin: 0 } .closed-wrap .muted { font-size: 16px; color: #8FA9CC }

</style>
</head>
