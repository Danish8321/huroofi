<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Grown-ups only</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #13294B; font-family: 'Baloo Bhaijaan 2', 'Noto Sans Arabic', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; padding: 64px 28px 36px; overflow: hidden">
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFC93C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
  <h1 style="margin: 14px 0 0; font-size: 32px; font-weight: 800; text-align: center">Grown-ups only</h1>
  <p style="margin: 8px 0 0; font-size: 18px; font-weight: 500; line-height: 1.4; text-align: center; color: #D5E2F0">Press and hold the circle for 3 seconds to open settings.</p>

  <button type="button" onPointerDown="{{start}}" onPointerUp="{{stop}}" onPointerLeave="{{stop}}" onPointerCancel="{{stop}}" aria-label="Press and hold for 3 seconds" style="margin-top: 56px; position: relative; width: 200px; height: 200px; border-radius: 50%; border: none; background: #1D3A66; cursor: pointer; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none">
    <svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true" style="position: absolute; inset: 0">
      <circle cx="100" cy="100" r="86" fill="none" stroke="#2C4A7A" stroke-width="14"></circle>
      <circle cx="100" cy="100" r="86" fill="none" stroke="#FFC93C" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="{{dash}}" transform="rotate(-90 100 100)"></circle>
    </svg>
    <span style="position: relative; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-size: 26px; font-weight: 800; color: #FFFFFF">{{label}}</span>
  </button>

  <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
    <a href="Parents.dc.html" style="margin-top: 40px; width: 100%; height: 64px; border-radius: 22px; background: #FFC93C; color: #13294B; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800">Open Parent zone</a>
  </sc-if>

  <a href="ToddlerHome.dc.html" style="margin-top: auto; min-height: 48px; display: flex; align-items: center; font-size: 18px; font-weight: 700">Back to play</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const st = this.state || {};
    const p = st.p || 0;
    const open = !!st.open;
    return {
      open,
      dash: p + ' 100',
      label: open ? 'Unlocked' : (p > 0 ? 'Keep holding…' : 'Hold'),
      start: () => {
        if (open) return;
        clearInterval(this.timer);
        this.timer = setInterval(() => {
          this.setState((s) => {
            const np = ((s && s.p) || 0) + 5;
            if (np >= 100) {
              clearInterval(this.timer);
              return { p: 100, open: true };
            }
            return { p: np };
          });
        }, 150);
      },
      stop: () => {
        if (open) return;
        clearInterval(this.timer);
        this.setState({ p: 0 });
      }
    };
  }
}
</script>
</body>
</html>
