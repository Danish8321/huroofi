<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Letter map</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
</style>
</helmet>
<div style="width: 390px; height: 1250px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', 'Noto Sans Arabic', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 22px 20px 0">
    <div style="display: flex; flex-direction: column; flex-grow: 1">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; line-height: 1.1">Letter Map</h1>
      <div style="font-size: 18px; font-weight: 600; color: #4A5D7A">28 letters · 7 stages · finish one to unlock the next</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; background: #FFC93C; border-radius: 999px; padding: 6px 14px 6px 10px; box-shadow: 0 4px 0 #E0A400">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="#FFFFFF" stroke="#13294B" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      <span style="font-size: 20px; font-weight: 800">12</span>
    </div>
  </div>

  <div style="position: relative; margin-top: 24px; height: 1028px">
    <svg width="390" height="1028" viewBox="0 0 390 1028" style="position: absolute; top: 0; left: 0" aria-hidden="true">
      <path d="M152 64 C152 139 238 139 238 214 C238 289 152 289 152 364 C152 439 238 439 238 514 C238 589 152 589 152 664 C152 739 238 739 238 814 C238 889 152 889 152 964" fill="none" stroke="#A9CBF2" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 18"></path>
    </svg>
    <div style="position: relative; display: flex; flex-direction: column; gap: 22px">
      <sc-for list="{{stages}}" as="s" hint-placeholder-count="7">
        <div style="margin-left: {{s.left}}; width: 268px; height: 128px; box-sizing: border-box; background: #FFFFFF; border-radius: 26px; border: {{s.border}}; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 0 {{s.shadow}}">
          <div style="display: flex; align-items: center; gap: 10px; height: 44px">
            <span style="width: 34px; height: 34px; border-radius: 50%; background: {{s.pastel}}; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex-shrink: 0">{{s.num}}</span>
            <span style="flex-grow: 1; font-size: 20px; font-weight: 800; color: {{s.nameColor}}">{{s.name}}</span>
            <sc-if value="{{s.isCurrent}}" hint-placeholder-val="{{false}}">
              <a href="Lesson.dc.html" aria-label="Continue stage" style="width: 44px; height: 44px; border-radius: 50%; background: #1F6FE0; box-shadow: 0 4px 0 #1555B0; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
                <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg>
              </a>
            </sc-if>
            <sc-if value="{{s.isLocked}}" hint-placeholder-val="{{true}}">
              <span style="width: 44px; height: 44px; border-radius: 50%; background: #E3ECF7; display: flex; align-items: center; justify-content: center; color: #4A5D7A" aria-label="Locked">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
              </span>
            </sc-if>
          </div>
          <div dir="rtl" style="display: flex; gap: 8px">
            <sc-for list="{{s.letters}}" as="l" hint-placeholder-count="4">
              <span style="width: 50px; height: 44px; box-sizing: border-box; border-radius: 14px; background: {{l.bg}}; border: {{l.border}}; color: {{l.color}}; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 28px; font-weight: 700; line-height: 1">{{l.ch}}</span>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <nav style="margin-top: auto; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -4px 16px rgba(19, 41, 75, 0.08); display: flex; justify-content: space-around; padding: 10px 8px 16px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; min-height: 52px; text-decoration: none; color: #4A5D7A; font-size: 16px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
      Home
    </a>
    <a href="StageMap.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; min-height: 52px; text-decoration: none; color: #1F6FE0; font-size: 16px; font-weight: 800">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>
      Map
    </a>
    <a href="Reward.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; min-height: 52px; text-decoration: none; color: #4A5D7A; font-size: 16px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
      Stickers
    </a>
    <a href="ParentGate.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; min-height: 52px; text-decoration: none; color: #4A5D7A; font-size: 16px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      Parents
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1250}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { name: 'Sunny Meadow', letters: ['أ','ب','ت','ث'], ring: '#F59E0B', pastel: '#FFEDC4' },
      { name: 'Carrot Farm',  letters: ['ج','ح','خ','د'], ring: '#EC4F8C', pastel: '#FFDDEA' },
      { name: 'Flower Hill',  letters: ['ذ','ر','ز','س'], ring: '#14A88E', pastel: '#D2F4EC' },
      { name: 'Rocket Base',  letters: ['ش','ص','ض','ط'], ring: '#7C5CE0', pastel: '#E8E0FF' },
      { name: 'Birdy Forest', letters: ['ظ','ع','غ','ف'], ring: '#2F80ED', pastel: '#DAEAFF' },
      { name: 'Pencil Town',  letters: ['ق','ك','ل','م'], ring: '#4CAF3A', pastel: '#DFF5D5' },
      { name: 'Star Castle',  letters: ['ن','ه','و','ي'], ring: '#F2643A', pastel: '#FFE2D7' }
    ];
    const stages = raw.map((s, i) => {
      const isCurrent = i === 0;
      const letters = s.letters.map((ch, j) => {
        if (isCurrent && j === 0) return { ch, bg: '#158048', color: '#FFFFFF', border: '0' };
        if (isCurrent && j === 1) return { ch, bg: '#FFFFFF', color: '#13294B', border: '3px solid #1F6FE0' };
        if (isCurrent) return { ch, bg: s.pastel, color: '#13294B', border: '0' };
        return { ch, bg: '#EEF3F9', color: '#4A5D7A', border: '0' };
      });
      return {
        num: i + 1,
        name: s.name,
        left: i % 2 === 0 ? '18px' : '104px',
        border: isCurrent ? '4px solid ' + s.ring : '3px solid #D5E2F0',
        shadow: isCurrent ? s.pastel : '#D5E2F0',
        pastel: s.pastel,
        nameColor: isCurrent ? '#13294B' : '#4A5D7A',
        isCurrent,
        isLocked: !isCurrent,
        letters
      };
    });
    return { stages };
  }
}
</script>
</body>
</html>
