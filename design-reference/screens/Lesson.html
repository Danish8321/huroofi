<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Meet the letter</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', 'Noto Sans Arabic', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 26px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Main.dc.html" aria-label="Back to home" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #13294B; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; gap: 6px; background: #FFFFFF; border-radius: 999px; padding: 5px">
      <span style="flex-grow: 1; height: 38px; border-radius: 999px; background: #1F6FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">1 Meet</span>
      <span style="flex-grow: 1; height: 38px; border-radius: 999px; color: #4A5D7A; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">2 Trace</span>
      <span style="flex-grow: 1; height: 38px; border-radius: 999px; color: #4A5D7A; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">3 Play</span>
    </div>
  </div>

  <div style="margin-top: 16px; background: #F59E0B; border-radius: 34px; padding: 8px; box-shadow: 0 8px 0 #CFE2F7">
    <div style="background: #FFFFFF; border-radius: 28px; padding: 14px 14px 14px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: #F59E0B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800">2</span>
        <span style="flex-grow: 1; font-size: 18px; font-weight: 700">baa</span>
        <span dir="rtl" style="background: #FFEDC4; border-radius: 999px; padding: 2px 16px; font-family: 'Noto Naskh Arabic', serif; font-size: 30px; font-weight: 700; line-height: 1.4">باء</span>
      </div>
      <div dir="rtl" style="text-align: center; font-family: 'Noto Naskh Arabic', serif; font-size: 170px; font-weight: 700; line-height: 1.15; color: #13294B">ب</div>
      <div style="display: flex; align-items: center; gap: 12px; background: #FFEDC4; border-radius: 22px; padding: 8px 16px">
        <img src="../../assets/illustrations/png/duck.png" alt="Duck" style="width: 104px; height: 104px; object-fit: contain">
        <div style="display: flex; flex-direction: column; flex-grow: 1; align-items: flex-end">
          <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 46px; font-weight: 700; line-height: 1.3"><span style="color: #A35400">ب</span>طة</span>
          <span style="font-size: 18px; font-weight: 600; color: #4A5D7A">baṭṭa · duck</span>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; margin-top: 22px">
    <button type="button" aria-label="Hear the letter" style="width: 72px; height: 72px; border-radius: 50%; border: none; background: #FFC93C; box-shadow: 0 6px 0 #E0A400; display: flex; align-items: center; justify-content: center; color: #13294B; cursor: pointer; flex-shrink: 0">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 22px; font-weight: 800; line-height: 1.1">Say it with me!</span>
      <span style="font-size: 18px; font-weight: 600; color: #4A5D7A">Tap to hear “b” as in baṭṭa</span>
    </div>
  </div>

  <div style="margin-top: 20px">
    <div style="font-size: 18px; font-weight: 800; color: #4A5D7A; margin-bottom: 8px"><span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 24px; font-weight: 700; color: #13294B">ب</span> changes shape in words</div>
    <div dir="rtl" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFFFF; border-radius: 18px; padding: 6px 0 8px; display: flex; flex-direction: column; align-items: center">
        <span style="font-family: 'Noto Naskh Arabic', serif; font-size: 38px; font-weight: 700; line-height: 1.35">ب</span>
        <span style="font-size: 16px; font-weight: 700; color: #4A5D7A">Alone</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 6px 0 8px; display: flex; flex-direction: column; align-items: center">
        <span style="font-family: 'Noto Naskh Arabic', serif; font-size: 38px; font-weight: 700; line-height: 1.35">بـ</span>
        <span style="font-size: 16px; font-weight: 700; color: #4A5D7A">Start</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 6px 0 8px; display: flex; flex-direction: column; align-items: center">
        <span style="font-family: 'Noto Naskh Arabic', serif; font-size: 38px; font-weight: 700; line-height: 1.35">ـبـ</span>
        <span style="font-size: 16px; font-weight: 700; color: #4A5D7A">Middle</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 6px 0 8px; display: flex; flex-direction: column; align-items: center">
        <span style="font-family: 'Noto Naskh Arabic', serif; font-size: 38px; font-weight: 700; line-height: 1.35">ـب</span>
        <span style="font-size: 16px; font-weight: 700; color: #4A5D7A">End</span>
      </div>
    </div>
  </div>

  <a href="Trace.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 22px; background: #1F6FE0; box-shadow: 0 6px 0 #1555B0; color: #FFFFFF; text-decoration: none; font-size: 22px; font-weight: 800">
    Next: Trace it
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </a>
</div>
</x-dc>

  renderVals() {
    return {};
  }

</script>
</body>
</html>
