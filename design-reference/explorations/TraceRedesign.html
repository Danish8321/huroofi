<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Trace redesign</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,6px)}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(0.2);opacity:0}25%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot));opacity:1}}
@keyframes twinkle{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes ready{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 26px; gap: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="#" aria-label="Back to lesson" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #13294B; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; align-items: center" aria-label="Step 2 of 3: Trace">
      <span aria-label="Meet, done" style="width: 40px; height: 40px; border-radius: 50%; background: #158048; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      </span>
      <span style="flex-grow: 1; height: 4px; background: #158048"></span>
      <span style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px; background: {{stepBg}}; color: #FFFFFF; font-size: 16px; font-weight: 800">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: {{stepBg}}; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"></path></svg>
        </span>
        Trace
      </span>
      <span style="flex-grow: 1; height: 4px; background: #C9D6E6"></span>
      <span aria-label="Play" style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; color: #4A5D7A; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
      </span>
    </div>
  </div>

  <button type="button" aria-label="Hear the hint again" style="display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; border-radius: 999px; border: none; background: {{hintBg}}; font-family: inherit; color: #13294B; cursor: pointer; align-self: flex-start">
    <span style="width: 48px; height: 48px; border-radius: 50%; background: #FFC93C; box-shadow: 0 4px 0 #E0A400; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#13294B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
    </span>
    <span style="font-size: 18px; font-weight: 700; text-align: left">{{hint}}</span>
  </button>

  <button type="button" onClick="{{finish}}" aria-label="{{canvasLabel}}" style="position: relative; flex: 1; min-height: 360px; background: #FFFFFF; border: {{canvasBorder}}; box-sizing: border-box; border-radius: 36px; box-shadow: 0 8px 0 {{canvasShadow}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; font-family: inherit; color: #13294B; overflow: hidden">
    <svg width="350" height="380" viewBox="0 0 320 282" aria-hidden="true">
      <line x1="16" y1="172" x2="304" y2="172" stroke="#E3ECF7" stroke-width="3"></line>
      <path d="M262 62 C272 120 252 172 200 172 L110 172 C66 172 50 148 54 112" fill="none" stroke="#FFEDC4" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M262 62 C272 120 252 172 200 172 L110 172 C66 172 50 148 54 112" fill="none" stroke="#F5C46A" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"></path>
      <path d="M262 62 C272 120 252 172 200 172 L110 172 C66 172 50 148 54 112" pathLength="100" fill="none" stroke="#FF7A59" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="{{ink}} 100"></path>
      <circle cx="262" cy="62" r="18" fill="#158048"></circle>
      <path d="M255 62l5 5 9-10" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="158" cy="232" r="18" fill="{{dotFill}}" stroke="{{dotStroke}}" stroke-width="3" stroke-dasharray="{{dotDash}}"></circle>
    </svg>
    <sc-if value="{{tracing}}" hint-placeholder-val="{{true}}">
      <span style="position: absolute; left: 137px; top: 256px; width: 34px; height: 34px; border-radius: 50%; background: #FF7A59; border: 4px solid #FFFFFF; box-shadow: 0 2px 6px rgba(19, 41, 75, 0.25); animation: nudge 1.4s ease-in-out infinite" aria-hidden="true"></span>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
        <sc-for list="{{burst}}" as="b" hint-placeholder-count="10">
          <svg width="{{b.size}}" height="{{b.size}}" viewBox="0 0 24 24" style="position: absolute; left: 50%; top: 46%; --dx: {{b.dx}}; --dy: {{b.dy}}; --rot: {{b.rot}}; animation: burst 0.9s {{b.delay}} cubic-bezier(.2,.9,.3,1.2) both, twinkle 1.6s 1s ease-in-out infinite"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="{{b.fill}}" stroke="#E0A400" stroke-width="1.2" stroke-linejoin="round"></path></svg>
        </sc-for>
      </span>
      <span style="position: absolute; bottom: 18px; left: 0; right: 0; margin: 0 auto; width: max-content; display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 6px; border-radius: 999px; background: #158048; color: #FFFFFF; font-size: 20px; font-weight: 800; white-space: nowrap; animation: rise 0.4s 0.5s ease-out both">
        <img src="../../assets/illustrations/png/lion.png" alt="" style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; object-fit: contain">
        <span>You traced <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 26px; font-weight: 700; line-height: 1">ب</span>!</span>
      </span>
    </sc-if>
  </button>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
    <button type="button" aria-label="Orange crayon, selected" aria-pressed="true" style="width: 60px; height: 60px; border-radius: 50%; background: #FF7A59; border: 5px solid #13294B; box-shadow: 0 4px 0 rgba(19, 41, 75, 0.18); cursor: pointer; padding: 0; transform: translateY(-6px)"></button>
    <button type="button" aria-label="Blue crayon" aria-pressed="false" style="width: 60px; height: 60px; border-radius: 50%; background: #3B8CF0; border: 5px solid #FFFFFF; box-shadow: 0 4px 0 rgba(19, 41, 75, 0.18); cursor: pointer; padding: 0"></button>
    <button type="button" aria-label="Green crayon" aria-pressed="false" style="width: 60px; height: 60px; border-radius: 50%; background: #3BAA5C; border: 5px solid #FFFFFF; box-shadow: 0 4px 0 rgba(19, 41, 75, 0.18); cursor: pointer; padding: 0"></button>
    <button type="button" aria-label="Purple crayon" aria-pressed="false" style="width: 60px; height: 60px; border-radius: 50%; background: #8A6CE8; border: 5px solid #FFFFFF; box-shadow: 0 4px 0 rgba(19, 41, 75, 0.18); cursor: pointer; padding: 0"></button>
    <button type="button" aria-label="Pink crayon" aria-pressed="false" style="width: 60px; height: 60px; border-radius: 50%; background: #FF6FA5; border: 5px solid #FFFFFF; box-shadow: 0 4px 0 rgba(19, 41, 75, 0.18); cursor: pointer; padding: 0"></button>
  </div>

  <div style="margin-top: auto; display: flex; gap: 12px">
    <button type="button" onClick="{{reset}}" aria-label="Start again" style="width: 64px; height: 64px; border-radius: 22px; border: 3px solid #A9CBF2; background: #FFFFFF; color: #13294B; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"></path><path d="M4 4v5h5"></path></svg>
    </button>
    <button type="button" aria-disabled="{{locked}}" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 22px; border: none; background: {{nextBg}}; box-shadow: 0 6px 0 {{nextShadow}}; color: {{nextFg}}; font-family: inherit; font-size: 20px; font-weight: 800; cursor: {{nextCursor}}; animation: {{nextAnim}}">
      <sc-if value="{{tracing}}" hint-placeholder-val="{{true}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      </sc-if>
      {{nextLabel}}
      <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </sc-if>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const done = !!(this.state && this.state.done);
    const burst = [
      [-120, -110, 44, '#FFC93C'], [0, -150, 52, '#FFC93C'], [118, -108, 40, '#FFE07A'],
      [-150, -10, 36, '#FFE07A'], [150, -20, 46, '#FFC93C'], [-110, 90, 40, '#FFC93C'],
      [110, 96, 34, '#FFE07A'], [-40, -70, 26, '#FFE07A'], [56, -60, 30, '#FFC93C'], [20, 80, 28, '#FFE07A']
    ].map(([dx, dy, size, fill], i) => ({
      dx: dx + 'px', dy: dy + 'px', size, fill, rot: (i % 2 ? 1 : -1) * (20 + i * 9) + 'deg', delay: (i * 0.05).toFixed(2) + 's'
    }));
    return {
      done,
      tracing: !done,
      burst,
      ink: done ? 100 : 58,
      dotFill: done ? '#FF7A59' : '#FFFFFF',
      dotStroke: done ? '#FF7A59' : '#F59E0B',
      dotDash: done ? 'none' : '4 5',
      hint: done ? 'Well done! Tap Next for the next letter' : 'Follow the path, then add the dot',
      hintBg: done ? '#DFF5E6' : '#FFFFFF',
      stepBg: done ? '#158048' : '#1F6FE0',
      canvasLabel: done ? 'Letter baa traced. Well done!' : 'Tracing the letter baa, more than half done. Tap to preview finishing',
      canvasBorder: done ? '4px solid #158048' : '4px solid #FFFFFF',
      canvasShadow: done ? '#0F5F35' : '#CFE2F7',
      locked: String(!done),
      nextLabel: done ? 'Next letter' : 'Finish ب first',
      nextBg: done ? '#1F6FE0' : '#D5E2F0',
      nextShadow: done ? '#1555B0' : '#C2D2E6',
      nextFg: done ? '#FFFFFF' : '#4A5D7A',
      nextCursor: done ? 'pointer' : 'default',
      nextAnim: done ? 'ready 1.4s 1s ease-in-out infinite' : 'none',
      finish: () => this.setState({ done: true }),
      reset: () => this.setState({ done: false })
    };
  }
}
</script>
</body>
</html>
