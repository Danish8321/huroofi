<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Weekly progress</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #F4F7FB; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 26px; gap: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="#" aria-label="Back to Parent zone" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; border: 1px solid #D5E2F0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #13294B; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; line-height: 1.1">Sara's week</h1>
      <span style="font-size: 16px; font-weight: 600; color: #4A5D7A">29 Sep – 5 Oct</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFFFFF; border-radius: 20px; border: 1px solid #D5E2F0; padding: 12px; display: flex; flex-direction: column">
      <span style="font-size: 30px; font-weight: 800; line-height: 1.1; color: #158048">2</span>
      <span style="font-size: 16px; font-weight: 600; color: #4A5D7A; line-height: 1.2">new letters</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 20px; border: 1px solid #D5E2F0; padding: 12px; display: flex; flex-direction: column">
      <span style="font-size: 30px; font-weight: 800; line-height: 1.1; color: #1F6FE0">84<span style="font-size: 18px">m</span></span>
      <span style="font-size: 16px; font-weight: 600; color: #4A5D7A; line-height: 1.2">play time</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 20px; border: 1px solid #D5E2F0; padding: 12px; display: flex; flex-direction: column">
      <span style="font-size: 30px; font-weight: 800; line-height: 1.1; color: #A86F00">5</span>
      <span style="font-size: 16px; font-weight: 600; color: #4A5D7A; line-height: 1.2">days played</span>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 22px; border: 1px solid #D5E2F0; padding: 16px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 20px; font-weight: 800">Minutes a day</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; color: #4A5D7A"><span style="width: 16px; border-top: 2px dashed #9AAAC0"></span>20 min limit</span>
    </div>
    <div style="position: relative; height: 150px; margin-top: 14px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end">
      <div style="position: absolute; left: 0; right: 0; bottom: 120px; border-top: 2px dashed #C9D6E6"></div>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 150px; gap: 4px">
          <span style="position: relative; z-index: 1; padding: 0 4px; border-radius: 6px; background: #FFFFFF; font-size: 16px; font-weight: 700; color: #4A5D7A; line-height: 1.2">{{d.label}}</span>
          <div style="position: relative; z-index: 1; width: 100%; height: {{d.h}}; min-height: 6px; border-radius: 8px 8px 4px 4px; background: {{d.fill}}"></div>
        </div>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <span style="text-align: center; font-size: 16px; font-weight: 700; color: #4A5D7A">{{d.day}}</span>
      </sc-for>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 22px; border: 1px solid #D5E2F0; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 20px; font-weight: 800">This week Sara met</span>
    <div style="display: flex; gap: 12px">
      <div style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: #FFEDC4">
        <span dir="rtl" style="width: 48px; height: 48px; border-radius: 14px; background: #158048; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 30px; font-weight: 700; line-height: 1">أ</span>
        <div style="display: flex; flex-direction: column; line-height: 1.2">
          <span style="font-size: 18px; font-weight: 800">alif</span>
          <span style="font-size: 16px; font-weight: 600; color: #4A5D7A">lion · learned</span>
        </div>
      </div>
      <div style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: #FFEDC4">
        <span dir="rtl" style="width: 48px; height: 48px; border-radius: 14px; background: #1F6FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 30px; font-weight: 700; line-height: 1">ب</span>
        <div style="display: flex; flex-direction: column; line-height: 1.2">
          <span style="font-size: 18px; font-weight: 800">baa</span>
          <span style="font-size: 16px; font-weight: 600; color: #4A5D7A">duck · learning</span>
        </div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: #EEF5FF">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1555B0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>
      <span style="flex-grow: 1; font-size: 16px; font-weight: 600; line-height: 1.3">Try together: point at a toy duck and say <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 20px; font-weight: 700">بطة</span>.</span>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 22px; border: 1px solid #D5E2F0; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 20px; font-weight: 800">Stages</span>
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 36px">
        <span style="width: 14px; height: 14px; border-radius: 5px; background: {{s.border}}; flex-shrink: 0"></span>
        <span style="width: 128px; flex-shrink: 0; font-size: 16px; font-weight: 700; color: {{s.text}}">{{s.name}}</span>
        <div style="flex-grow: 1; height: 12px; border-radius: 999px; background: #E3ECF7; overflow: hidden">
          <div style="width: {{s.w}}; height: 100%; background: {{s.border}}"></div>
        </div>
        <span style="width: 36px; text-align: right; font-size: 16px; font-weight: 700; color: #4A5D7A">{{s.count}}</span>
      </div>
    </sc-for>
  </div>

  <button type="button" style="height: 56px; border-radius: 18px; border: 1px solid #A9CBF2; background: #FFFFFF; color: #1555B0; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">See all 28 letters</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const mins = [18, 12, 0, 20, 16, 0, 18];
    const labels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const days = mins.map((m, i) => ({
      day: labels[i],
      label: m ? String(m) : '–',
      h: Math.round((m / 20) * 120) + 'px',
      fill: m ? '#1F6FE0' : '#E3ECF7'
    }));
    const stages = [
      ['Sunny Meadow', '#F59E0B', 1.5],
      ['Carrot Farm', '#EC4F8C', 0],
      ['Flower Hill', '#14A88E', 0],
      ['Rocket Base', '#7C5CE0', 0],
      ['Birdy Forest', '#2F80ED', 0],
      ['Pencil Town', '#4CAF3A', 0],
      ['Star Castle', '#F07D2A', 0]
    ].map(([name, border, done]) => ({
      name,
      border,
      w: (done / 4) * 100 + '%',
      count: Math.floor(done) + '/4',
      text: done ? '#13294B' : '#4A5D7A'
    }));
    return { days, stages };
  }
}
</script>
</body>
</html>
