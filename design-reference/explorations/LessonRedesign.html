<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Lesson redesign</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
@keyframes talk{0%,100%{transform:scale(0.85)}50%{transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 26px; gap: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="#" aria-label="Back to home" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #13294B; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; align-items: center" aria-label="Step 1 of 3: Meet">
      <span style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px; background: #1F6FE0; color: #FFFFFF; font-size: 16px; font-weight: 800">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: #1F6FE0; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </span>
        Meet
      </span>
      <span style="flex-grow: 1; height: 4px; background: #C9D6E6"></span>
      <span aria-label="Trace" style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; color: #4A5D7A; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"></path></svg>
      </span>
      <span style="flex-grow: 1; height: 4px; background: #C9D6E6"></span>
      <span aria-label="Play" style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; color: #4A5D7A; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
      </span>
    </div>
  </div>

  <button type="button" aria-label="Letter baa. Tap to hear it" style="position: relative; flex: 1; min-height: 292px; border-radius: 36px; border: 6px solid #F59E0B; box-sizing: border-box; background: #FFEDC4; box-shadow: 0 8px 0 #C77F00; display: flex; align-items: center; justify-content: center; font-family: inherit; color: #13294B; cursor: pointer; padding: 0">
    <span style="position: absolute; top: 14px; left: 16px; display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 20px; font-weight: 800">baa</span>
      <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 24px; font-weight: 700; color: #A35400">باء</span>
    </span>
    <span style="position: absolute; top: 12px; right: 12px; width: 60px; height: 60px; border-radius: 50%; background: #FFC93C; box-shadow: 0 5px 0 #E0A400; display: flex; align-items: center; justify-content: center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#13294B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: talk 0.8s ease-in-out infinite"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
    </span>
    <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 180px; font-weight: 700; line-height: 1; margin-top: -10px">ب</span>
  </button>

  <button type="button" aria-label="Duck, batta. Tap to hear it" style="display: flex; align-items: center; gap: 14px; padding: 10px 18px 10px 10px; border-radius: 28px; border: none; background: #FFFFFF; box-shadow: 0 6px 0 #CFE2F7; font-family: inherit; color: #13294B; cursor: pointer">
    <span style="width: 104px; height: 104px; border-radius: 22px; background: #FFF6E0; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <img src="../../assets/illustrations/png/duck.png" alt="" style="width: 88px; height: 88px; object-fit: contain">
    </span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-end">
      <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 48px; font-weight: 700; line-height: 1.3"><span style="color: #A35400; text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 10px">ب</span>طة</span>
      <span style="font-size: 18px; font-weight: 600; color: #4A5D7A">baṭṭa · duck</span>
    </span>
  </button>

  <div style="background: #FFFFFF; border-radius: 26px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 18px; font-weight: 800"><span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 22px; font-weight: 700">ب</span> in words</span>
      <span style="padding: 2px 10px; border-radius: 999px; background: #E8E0FF; color: #4C2DB0; font-size: 16px; font-weight: 800">Reader</span>
    </div>
    <div dir="rtl" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <span style="height: 64px; border-radius: 16px; background: #FFEDC4; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 34px; font-weight: 700; line-height: 1">ب</span>
      <span style="height: 64px; border-radius: 16px; background: #F4F7FB; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 34px; font-weight: 700; line-height: 1">بـ</span>
      <span style="height: 64px; border-radius: 16px; background: #F4F7FB; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 34px; font-weight: 700; line-height: 1">ـبـ</span>
      <span style="height: 64px; border-radius: 16px; background: #F4F7FB; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 34px; font-weight: 700; line-height: 1">ـب</span>
    </div>
  </div>

  <a href="#" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 22px; background: #1F6FE0; box-shadow: 0 6px 0 #1555B0; color: #FFFFFF; text-decoration: none; font-size: 22px; font-weight: 800">
    Trace it
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
