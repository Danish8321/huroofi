<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Toddler cards redesign</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
@keyframes talk{0%,100%{transform:scale(0.85)}50%{transform:scale(1.1)}}
@keyframes wob{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF4D6; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 30px; gap: 18px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="#" aria-label="Home" style="width: 64px; height: 64px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 5px 0 #F3DC9C; display: flex; align-items: center; justify-content: center; color: #A35400">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>
    </a>
    <div aria-label="Card 2 of 6" style="display: flex; gap: 8px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
        <span style="width: {{d.w}}; height: 14px; border-radius: 999px; background: {{d.bg}}"></span>
      </sc-for>
    </div>
    <span style="width: 64px"></span>
  </div>

  <button type="button" aria-label="Duck, بطة. Tap to hear" style="position: relative; flex: 1; border: 8px solid #F59E0B; border-radius: 48px; background: #FFFFFF; box-shadow: 0 10px 0 #C77F00; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 20px; font-family: inherit; color: #13294B; cursor: pointer; animation: wob 3s ease-in-out infinite">
    <span dir="rtl" style="position: absolute; top: 16px; right: 16px; width: 76px; height: 76px; border-radius: 26px; background: #FFEDC4; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 52px; font-weight: 700; line-height: 1; color: #A35400; padding-top: 10px; box-sizing: border-box">ب</span>
    <img src="../../assets/illustrations/png/duck.png" alt="" style="width: 280px; height: 280px; object-fit: contain">
    <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 64px; font-weight: 700; line-height: 1.5"><span style="color: #A35400">ب</span>طة</span>
    <span style="position: absolute; bottom: 18px; left: 18px; width: 64px; height: 64px; border-radius: 50%; background: #FFC93C; box-shadow: 0 5px 0 #E0A400; display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#13294B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: talk 0.8s ease-in-out infinite"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
    </span>
  </button>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px">
    <button type="button" aria-label="Previous picture" style="width: 96px; height: 96px; border-radius: 50%; border: none; background: #FFFFFF; box-shadow: 0 6px 0 #F3DC9C; display: flex; align-items: center; justify-content: center; color: #A35400; cursor: pointer">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div aria-hidden="true" style="display: flex; gap: 6px; align-items: flex-end">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; opacity: 0.6; display: flex; align-items: center; justify-content: center"><img src="../../assets/illustrations/png/lion.png" alt="" style="width: 36px; height: 36px; object-fit: contain"></span>
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; opacity: 0.6; display: flex; align-items: center; justify-content: center"><img src="../../assets/illustrations/png/apple.png" alt="" style="width: 36px; height: 36px; object-fit: contain"></span>
    </div>
    <button type="button" aria-label="Next picture" style="width: 96px; height: 96px; border-radius: 50%; border: none; background: #1F6FE0; box-shadow: 0 6px 0 #1555B0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; cursor: pointer">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dots = [0, 1, 2, 3, 4, 5].map((i) => ({
      w: i === 1 ? '36px' : '14px',
      bg: i < 1 ? '#F59E0B' : i === 1 ? '#A35400' : '#F3DC9C'
    }));
    return { dots };
  }
}
</script>
</body>
</html>
