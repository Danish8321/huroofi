<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Picture game redesign</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
@keyframes wiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes pop{0%{transform:scale(0.4);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 26px; gap: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="#" aria-label="Leave game" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #13294B; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; justify-content: center; align-items: center; gap: 8px" aria-label="Question 3 of 5">
      <sc-for list="{{progress}}" as="p" hint-placeholder-count="5">
        <span style="width: {{p.w}}; height: 14px; border-radius: 999px; background: {{p.bg}}"></span>
      </sc-for>
    </div>
    <span style="width: 48px"></span>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 6px">
    <img src="../../assets/illustrations/png/lion.png" alt="Leo" style="width: 76px; height: 76px; object-fit: contain; flex-shrink: 0">
    <button type="button" aria-label="Hear the question: which one starts with baa?" style="flex-grow: 1; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 28px 28px 28px 8px; border: none; background: #FFFFFF; box-shadow: 0 6px 0 #CFE2F7; font-family: inherit; color: #13294B; cursor: pointer">
      <span style="width: 52px; height: 52px; border-radius: 50%; background: #FFC93C; box-shadow: 0 4px 0 #E0A400; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#13294B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
      </span>
      <span style="flex-grow: 1; text-align: left; font-size: 20px; font-weight: 800; line-height: 1.15">Which starts with</span>
      <span dir="rtl" style="width: 60px; height: 60px; border-radius: 18px; background: #FFEDC4; border: 3px solid #F59E0B; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 40px; font-weight: 700; line-height: 1; color: #A35400">ب</span>
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
      <button type="button" aria-label="{{t.label}}" onClick="{{t.pick}}" style="position: relative; flex: 1; min-height: 136px; box-sizing: border-box; border-radius: 32px; background: #FFFFFF; border: {{t.border}}; box-shadow: 0 6px 0 {{t.shadow}}; display: flex; align-items: center; justify-content: center; gap: 18px; cursor: pointer; padding: 0 16px; font-family: inherit; color: #13294B; animation: {{t.anim}}">
        <img src="{{t.img}}" alt="" style="width: 132px; height: 132px; object-fit: contain">
        <sc-if value="{{t.reveal}}" hint-placeholder-val="{{false}}">
          <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 44px; font-weight: 700; line-height: 1.3; animation: pop 0.3s ease-out"><span style="color: #A35400">{{t.first}}</span>{{t.rest}}</span>
        </sc-if>
        <sc-if value="{{t.stars}}" hint-placeholder-val="{{false}}">
          <img src="../../assets/illustrations/png/star.png" alt="" style="position: absolute; top: -16px; right: 12px; width: 48px; height: 48px; object-fit: contain; animation: pop 0.35s ease-out">
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto">
    <sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
      <div style="height: 64px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700; color: #4A5D7A">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v6"></path><path d="M13 9a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-.5A6.5 6.5 0 0 1 4 14.5V12a2 2 0 0 1 4 0"></path></svg>
        Tap a picture
      </div>
    </sc-if>
    <sc-if value="{{wrong}}" hint-placeholder-val="{{false}}">
      <div style="height: 64px; border-radius: 22px; background: #FFE4D6; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 20px; font-weight: 800; color: #9A3412">Almost! Look at the wiggly one</div>
    </sc-if>
    <sc-if value="{{right}}" hint-placeholder-val="{{false}}">
      <a href="#" style="height: 64px; border-radius: 22px; background: #158048; box-shadow: 0 6px 0 #0F5F35; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: 800">
        Great job! Next
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const picked = (this.state && this.state.picked) || null;
    const list = [
      { id: 'fox', img: '../../assets/illustrations/png/fox.png', label: 'Fox', first: 'ث', rest: 'علب' },
      { id: 'duck', img: '../../assets/illustrations/png/duck.png', label: 'Duck', first: 'ب', rest: 'طة' },
      { id: 'apple', img: '../../assets/illustrations/png/apple.png', label: 'Apple', first: 'ت', rest: 'فاح' }
    ];
    const answer = 'duck';
    const solved = picked === answer;
    const missed = !!picked && !solved;
    const tiles = list.map((t) => {
      const isAnswer = t.id === answer;
      return {
        ...t,
        border: solved && isAnswer ? '6px solid #158048' : '6px solid #FFFFFF',
        shadow: solved && isAnswer ? '#0F5F35' : '#CFE2F7',
        anim: missed && isAnswer ? 'wiggle 0.5s ease-in-out 3' : 'none',
        reveal: solved ? isAnswer : picked === t.id,
        stars: solved && isAnswer,
        pick: () => this.setState({ picked: t.id })
      };
    });
    const progress = [0, 1, 2, 3, 4].map((i) => {
      const doneQ = i < 2 || (i === 2 && solved);
      return { w: i === 2 ? '36px' : '14px', bg: doneQ ? '#158048' : i === 2 ? '#1F6FE0' : '#C9D6E6' };
    });
    return { tiles, progress, idle: !picked, wrong: missed, right: solved };
  }
}
</script>
</body>
</html>
