  </div>

  <button type="button" aria-label="Press and hold for 2 seconds" style="margin-top: 44px; position: relative; width: 224px; height: 224px; border-radius: 50%; border: none; background: #1D3A66; cursor: pointer; padding: 0; font-family: inherit">

    </span>

  <p style="margin: auto 0 0; font-size: 16px; font-weight: 600; color: #9AB0CF; text-align: center">Letting go starts the circle again.</p>
