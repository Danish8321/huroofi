<style>

a{color:#1F6FE0}a:hover{color:#1555B0}

<div style="position: relative; width: 1180px; height: 820px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; color: #13294B; display: flex; gap: 32px; padding: 28px 36px 36px; overflow: hidden">

    </button>
    <div style="margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between">
      <img src="../../assets/illustrations/png/lion.png" alt="Leo the lion" style="width: 170px; height: 170px; object-fit: contain; animation: bob 2.6s ease-in-out infinite">
      <button type="button" aria-label="Next. It starts by itself in a moment" style="position: relative; width: 120px; height: 120px; border-radius: 50%; border: none; background: transparent; cursor: pointer; padding: 0">

      <img src="../../assets/illustrations/png/star.png" alt="" style="position: absolute; top: 34px; left: 36px; width: 72px; height: 72px">
