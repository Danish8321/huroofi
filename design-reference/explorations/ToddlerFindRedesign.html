<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Toddler find redesign</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
@keyframes talk{0%,100%{transform:scale(0.85)}50%{transform:scale(1.1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes fillbar{from{width:0}to{width:100%}}
@keyframes pop{0%{transform:scale(0.3);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 30px; gap: 18px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Home" style="width: 64px; height: 64px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 5px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #1F6FE0; flex-shrink: 0">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>
    </a>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 4px">
    <img src="../../assets/illustrations/png/lion.png" alt="Leo the lion" style="width: 108px; height: 108px; object-fit: contain; flex-shrink: 0">
    <button type="button" aria-label="Leo asks: Where is the duck? Tap to hear again" style="flex-grow: 1; display: flex; align-items: center; gap: 12px; height: 88px; padding: 0 16px 0 12px; background: #FFFFFF; border: none; border-radius: 34px 34px 34px 8px; font-family: inherit; color: #13294B; cursor: pointer; margin-bottom: 14px">
      <span style="width: 60px; height: 60px; border-radius: 50%; background: #FFC93C; box-shadow: 0 4px 0 #E0A400; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#13294B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: talk 0.8s ease-in-out infinite"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
      </span>
      <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 34px; font-weight: 700; line-height: 1.4; white-space: nowrap">أين البطة؟</span>
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
      <button type="button" onClick="{{c.pick}}" aria-label="{{c.aria}}" style="position: relative; flex: 1; border-radius: 44px; border: 8px solid {{c.border}}; background: #FFFFFF; box-shadow: 0 8px 0 {{c.shadow}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; animation: {{c.anim}}">
        <img src="{{c.img}}" alt="" style="width: 200px; height: 200px; object-fit: contain">
        <sc-if value="{{c.won}}" hint-placeholder-val="{{false}}">
          <img src="../../assets/illustrations/png/star.png" alt="" style="position: absolute; top: 12px; left: 22px; width: 56px; height: 56px; animation: pop 0.5s ease-out both">
          <img src="../../assets/illustrations/png/star.png" alt="" style="position: absolute; top: 34px; right: 26px; width: 44px; height: 44px; animation: pop 0.5s 0.12s ease-out both">
          <img src="../../assets/illustrations/png/star.png" alt="" style="position: absolute; bottom: 16px; right: 60px; width: 48px; height: 48px; animation: pop 0.5s 0.24s ease-out both">
        </sc-if>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{reset}}" aria-label="Next. It starts by itself in a moment" style="position: relative; overflow: hidden; height: 96px; border-radius: 34px; border: none; background: #158048; box-shadow: 0 7px 0 #0F5F35; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; background: #22A05C; animation: fillbar 4s 1s linear both"></span>
      <svg width="56" height="56" viewBox="0 0 24 24" style="position: relative" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </sc-if>
  <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="height: 96px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #4A5D7A; font-size: 18px; font-weight: 700">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a2 2 0 0 1 4 0v6"></path><path d="M13 9a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-.5A6.5 6.5 0 0 1 4 14.5V12a2 2 0 0 1 4 0"></path></svg>
      {{hint}}
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const picked = st.picked || null;
    const done = picked === 'duck';
    const nudged = picked === 'apple';
    const cards = [
      { id: 'duck', img: '../../assets/illustrations/png/duck.png', aria: 'Duck' },
      { id: 'apple', img: '../../assets/illustrations/png/apple.png', aria: 'Apple' }
    ].map((c) => {
      const isDuck = c.id === 'duck';
      const won = done && isDuck;
      return {
        ...c,
        won,
        border: won ? '#158048' : '#FFFFFF',
        shadow: won ? '#0F5F35' : '#CFE2F7',
        anim: nudged && isDuck ? 'wiggle 0.6s ease-in-out 3' : 'none',
        pick: () => this.setState({ picked: c.id })
      };
    });
    return {
      cards,
      done,
      notDone: !done,
      hint: nudged ? 'Leo wiggles the duck' : 'Tap a picture',
      reset: () => this.setState({ picked: null })
    };
  }
}
</script>
</body>
</html>
