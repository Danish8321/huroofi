<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Toddler meet the letter</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes talk{0%,100%{transform:scale(0.85)}50%{transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F4FF; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; align-items: center; padding: 18px 20px 30px; gap: 18px; overflow: hidden">

  <div style="width: 100%; display: flex; align-items: center; justify-content: space-between">
    <a href="#" aria-label="Home" style="width: 72px; height: 72px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 5px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #1F6FE0">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>
    </a>
    <div style="display: flex; gap: 8px" aria-label="Letter 2 of 4 in this set">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #F59E0B"></span>
      <span style="width: 34px; height: 14px; border-radius: 7px; background: #F59E0B"></span>
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #F5D9A0"></span>
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #F5D9A0"></span>
    </div>
    <a href="#" aria-label="Grown-ups: press and hold to open settings" style="width: 44px; height: 44px; border-radius: 50%; background: #D5E2F0; display: flex; align-items: center; justify-content: center; color: #4A5D7A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    </a>
  </div>

  <button type="button" aria-label="Letter baa. Tap to hear it" style="position: relative; width: 320px; height: 320px; border-radius: 50%; border: 8px solid #F59E0B; background: #FFEDC4; box-shadow: 0 10px 0 #C77F00; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; animation: breathe 3s ease-in-out infinite">
    <span style="position: absolute; inset: 18px; border-radius: 50%; border: 4px dashed #F5C46A"></span>
    <span dir="rtl" style="position: relative; font-family: 'Noto Naskh Arabic', serif; font-size: 210px; font-weight: 700; line-height: 1; color: #A35400; margin-top: -44px">ب</span>
  </button>

  <button type="button" aria-label="Duck, batta. Tap to hear it" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 16px; height: 184px; border-radius: 40px; border: 5px solid #F59E0B; box-sizing: border-box; background: #FFFFFF; box-shadow: 0 8px 0 #C77F00; font-family: inherit; color: #13294B; cursor: pointer; margin-top: 10px">
    <img src="../../assets/illustrations/png/duck.png" alt="" style="width: 128px; height: 128px; object-fit: contain">
    <span dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 72px; font-weight: 700; line-height: 1.3"><span style="color: #A35400">ب</span>طة</span>
  </button>

  <div style="margin-top: auto; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; box-sizing: border-box">
    <button type="button" aria-label="Previous letter" style="width: 84px; height: 84px; border-radius: 50%; border: none; background: #FFFFFF; box-shadow: 0 6px 0 #CFE2F7; display: flex; align-items: center; justify-content: center; color: #4A5D7A; cursor: pointer">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <button type="button" aria-label="Hear it again" style="width: 104px; height: 104px; border-radius: 50%; border: none; background: #FFC93C; box-shadow: 0 7px 0 #E0A400; display: flex; align-items: center; justify-content: center; color: #13294B; cursor: pointer">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: talk 0.8s ease-in-out infinite"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
    </button>
    <button type="button" aria-label="Next letter" style="width: 84px; height: 84px; border-radius: 50%; border: none; background: #1F6FE0; box-shadow: 0 6px 0 #1555B0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; cursor: pointer">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
