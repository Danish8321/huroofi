<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huroofi – Toddler paint redesign</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FE0}a:hover{color:#1555B0}
@keyframes talk{0%,100%{transform:scale(0.85)}50%{transform:scale(1.1)}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(0.2);opacity:0}25%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot));opacity:1}}
@keyframes twinkle{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes hop{0%{transform:translateY(60px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes countdown{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFDDEA; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; color: #13294B; display: flex; flex-direction: column; padding: 18px 20px 30px; gap: 18px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Home" style="width: 64px; height: 64px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 5px 0 #F2B5CC; display: flex; align-items: center; justify-content: center; color: #B0185A; flex-shrink: 0">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>
    </a>
    <button type="button" aria-label="Hear the letter baa" style="width: 64px; height: 64px; border-radius: 50%; border: none; background: #FFC93C; box-shadow: 0 5px 0 #E0A400; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#13294B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: talk 0.8s ease-in-out infinite"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
    </button>
  </div>

  <button type="button" onClick="{{finish}}" aria-label="{{canvasLabel}}" style="position: relative; flex: 1; border-radius: 44px; background: #FFFFFF; border: 8px solid {{canvasBorder}}; box-sizing: border-box; box-shadow: 0 8px 0 {{canvasShadow}}; overflow: hidden; padding: 0; cursor: pointer; font-family: inherit">
    <svg viewBox="0 0 334 470" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position: absolute; inset: 0">
      <path d="M282 150 C296 230 266 300 196 300 L104 300 C52 300 34 268 40 222" fill="none" stroke="#FFE7F0" stroke-width="58" stroke-linecap="round"></path>
      <path d="M282 150 C296 230 266 300 196 300 L104 300 C52 300 34 268 40 222" fill="none" stroke="#F2B5CC" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 14"></path>
      <circle cx="160" cy="386" r="28" fill="#FFE7F0"></circle>
      <circle cx="160" cy="386" r="28" fill="none" stroke="#F2B5CC" stroke-width="5" stroke-dasharray="4 12"></circle>
      <path d="M280 156 C294 226 268 292 200 298 L150 300" fill="none" stroke="#FF7A59" stroke-width="40" stroke-linecap="round" opacity="0.9"></path>
      <path d="M150 300 L106 298 C70 296 50 280 44 248" fill="none" stroke="#3B8CF0" stroke-width="40" stroke-linecap="round" opacity="0.9"></path>
      <circle cx="282" cy="150" r="20" fill="#158048"></circle>
      <path d="M274 150l6 6 10-11" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      <sc-if value="{{painting}}" hint-placeholder-val="{{true}}">
        <circle cx="160" cy="386" r="14" fill="#FFC93C"><animate attributeName="r" values="12;18;12" dur="1.4s" repeatCount="indefinite"></animate></circle>
      </sc-if>
      <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
        <circle cx="160" cy="386" r="26" fill="#3BAA5C"></circle>
      </sc-if>
    </svg>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
        <sc-for list="{{burst}}" as="b" hint-placeholder-count="10">
          <svg width="{{b.size}}" height="{{b.size}}" viewBox="0 0 24 24" style="position: absolute; left: 50%; top: 44%; --dx: {{b.dx}}; --dy: {{b.dy}}; --rot: {{b.rot}}; animation: burst 0.9s {{b.delay}} cubic-bezier(.2,.9,.3,1.2) both, twinkle 1.6s 1s ease-in-out infinite"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="{{b.fill}}" stroke="#E0A400" stroke-width="1.2" stroke-linejoin="round"></path></svg>
        </sc-for>
      </span>
      <img src="../../assets/illustrations/png/lion.png" alt="" style="position: absolute; right: 12px; bottom: 12px; width: 104px; height: 104px; object-fit: contain; animation: hop 0.6s 0.4s ease-out both, cheer 1.2s 1s ease-in-out infinite">
    </sc-if>
  </button>

  <sc-if value="{{painting}}" hint-placeholder-val="{{true}}">
    <div role="radiogroup" aria-label="Crayon colour" style="display: flex; align-items: flex-end; justify-content: space-between">
      <sc-for list="{{crayons}}" as="c" hint-placeholder-count="4">
        <button type="button" role="radio" aria-label="{{c.name}}" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="width: 72px; height: 72px; border-radius: 50%; border: {{c.ring}}; background: {{c.color}}; box-shadow: 0 5px 0 {{c.shade}}; transform: translateY({{c.lift}}); cursor: pointer; padding: 0; box-sizing: border-box"></button>
      </sc-for>
    </div>
    <button type="button" aria-label="Wipe and paint again" style="align-self: center; display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 24px; border-radius: 999px; border: none; background: #FFFFFF; box-shadow: 0 5px 0 #F2B5CC; color: #B0185A; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
    </button>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div style="height: 156px; display: flex; align-items: center; justify-content: center; gap: 24px">
      <button type="button" onClick="{{reset}}" aria-label="Paint it again" style="width: 72px; height: 72px; border-radius: 50%; border: none; background: #FFFFFF; box-shadow: 0 5px 0 #F2B5CC; color: #B0185A; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
      </button>
      <button type="button" onClick="{{reset}}" aria-label="Next letter. It starts by itself in a moment" style="position: relative; width: 120px; height: 120px; border-radius: 50%; border: none; background: transparent; cursor: pointer; padding: 0">
        <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true" style="position: absolute; inset: 0">
          <circle cx="60" cy="60" r="54" fill="none" stroke="#F2B5CC" stroke-width="8"></circle>
          <circle cx="60" cy="60" r="54" fill="none" stroke="#158048" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 60 60)" style="animation: countdown 4s 1s linear both"></circle>
        </svg>
        <span style="position: absolute; inset: 14px; border-radius: 50%; background: #158048; box-shadow: 0 5px 0 #0F5F35; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </span>
      </button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.sel || 'blue';
    const crayons = [
      ['orange', '#FF7A59', '#D9573A'],
      ['blue', '#3B8CF0', '#1F64C0'],
      ['green', '#3BAA5C', '#22803F'],
      ['purple', '#8A6CE8', '#6347C4']
    ].map(([name, color, shade]) => {
      const on = name === sel;
      return {
        name,
        color,
        shade,
        on: String(on),
        ring: on ? '6px solid #13294B' : '6px solid #FFFFFF',
        lift: on ? '-12px' : '0',
        pick: () => this.setState({ sel: name })
      };
    });
    const done = !!st.done;
    const burst = [
      [-120, -130, 44, '#FFC93C'], [0, -170, 52, '#FFC93C'], [118, -128, 40, '#FFE07A'],
      [-140, -20, 36, '#FFE07A'], [140, -30, 46, '#FFC93C'], [-110, 80, 40, '#FFC93C'],
      [110, 86, 34, '#FFE07A'], [-40, -80, 26, '#FFE07A'], [56, -70, 30, '#FFC93C'], [30, 120, 28, '#FFE07A']
    ].map(([dx, dy, size, fill], i) => ({
      dx: dx + 'px', dy: dy + 'px', size, fill, rot: (i % 2 ? 1 : -1) * (20 + i * 9) + 'deg', delay: (i * 0.05).toFixed(2) + 's'
    }));
    return {
      crayons,
      done,
      painting: !done,
      burst,
      canvasBorder: done ? '#158048' : '#EC4F8C',
      canvasShadow: done ? '#0F5F35' : '#B83A6B',
      canvasLabel: done ? 'You painted baa!' : 'Paint the letter baa with your finger. Tap to preview finishing',
      finish: () => this.setState({ done: true }),
      reset: () => this.setState({ done: false })
    };
  }
}
</script>
</body>
</html>
